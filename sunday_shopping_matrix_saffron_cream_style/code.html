</div>

<span class="font-label-sm text-label-sm">週日採買</span>
</button>
<button class="flex flex-col items-center justify-center text-outline px-4 py-1 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="insights">insights</span>
<span class="font-label-sm text-label-sm">圓夢看板</span>
</button>

<script>
        // Micro-interaction for checkboxes
        document.querySelectorAll('.custom-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const label = this.closest('label');
                const text = label.querySelector('span:first-of-type');
                const status = label.querySelector('span:last-of-type');
                
                if (this.checked) {
                    text.classList.add('line-through', 'opacity-50');
                    status.textContent = '已選取';
                    label.classList.add('bg-surface-container-highest');
                } else {
                    text.classList.remove('line-through', 'opacity-50');
                    status.textContent = '剩餘 ' + (Math.floor(Math.random() * 20) + 10) + '%';
                    label.classList.remove('bg-surface-container-highest');
                }
            });
        });
    </script>
