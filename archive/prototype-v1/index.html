<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CooCoo 煮煮 - 自煮生活系統化管家</title>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            alert("網頁偵測到 JS 錯誤！\n\n訊息: " + message + "\n檔案: " + source + "\n行號: " + lineno + "\n堆疊:\n" + (error && error.stack ? error.stack : "無"));
            return false;
        };
    </script>
    <!-- Precompiled Tailwind CSS -->
    <link href="./assets/tailwind.css" rel="stylesheet"/>
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    
    <!-- Custom Style Sheet -->
    <link href="./style.css" rel="stylesheet"/>
    
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col pb-20 select-none">
    <!-- TopAppBar -->
    <header class="bg-surface border-b border-surface-container-high sticky top-0 z-50 shadow-sm">
        <div class="max-w-[1200px] mx-auto flex justify-between items-center px-md sm:px-lg py-sm w-full">
            <div class="flex items-center gap-sm sm:gap-md min-w-0">
                <span class="material-symbols-outlined text-primary text-3xl">kitchen</span>
                <h1 class="text-base sm:text-xl font-extrabold text-primary tracking-wide whitespace-nowrap">CooCoo 煮煮</h1>
            </div>
            <div class="flex items-center gap-xs sm:gap-sm shrink-0">
                <button onclick="showChefConsultationModal()" title="主廚相談室" aria-label="主廚相談室" class="bg-amber-500/10 hover:bg-amber-500 text-amber-800 hover:text-white border border-amber-500/30 px-3 py-1.5 rounded-full font-extrabold text-xs transition-all active:scale-95 flex items-center gap-1">
                    <span class="material-symbols-outlined text-lg">restaurant_menu</span>
                    主廚相談室 👨‍🍳
                </button>
                <button onclick="renderCookwareSetup()" title="廚房裝備設定" aria-label="廚房裝備設定" class="text-on-surface-variant hover:bg-surface-container-high/40 p-2 rounded-full transition-colors active:scale-95 duration-150 flex items-center justify-center focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/20">
                    <span class="material-symbols-outlined text-xl">skillet</span>
                </button>
                <button onclick="toggleDevMenu()" title="開發者測試選單 (Dev Tools)" aria-label="開發者測試選單" class="text-amber-600 hover:bg-amber-500/10 p-2 rounded-full transition-colors active:scale-95 duration-150 flex items-center justify-center focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-amber-500/20">
                    <span class="material-symbols-outlined text-xl">bug_report</span>
                </button>
                <div class="h-8 w-[1px] bg-outline-variant/40"></div>
                <div id="user-auth-badge" class="flex items-center gap-2">
                    <!-- Dynamic Auth Badge from app.js -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="app-view" class="flex-1 min-w-0 w-full max-w-[1200px] mx-auto px-md md:px-lg py-md md:py-lg transition-all duration-300">
        <!-- Views will be dynamically injected here by app.js -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-outline-variant/30 shadow-lg z-50">
        <div class="max-w-[600px] mx-auto flex justify-around items-center h-16 px-md">
            <!-- Tab: Sunday Shopping Matrix -->
            <button id="nav-shopping" onclick="switchTab('shopping')" class="flex flex-col items-center justify-center w-20 h-full text-on-surface-variant hover:text-primary transition-colors focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/20 relative">
                <span class="material-symbols-outlined text-2xl transition-transform duration-200">shopping_cart</span>
                <span class="text-[11px] font-bold mt-1">補貨區</span>
                <!-- Badge for shopping items count -->
                <span id="shopping-badge" class="absolute top-1 right-4 bg-terracotta text-white text-[9px] font-extrabold w-4.5 h-4.5 flex items-center justify-center rounded-full border border-white hidden">0</span>
            </button>

            <!-- Tab: Fridge Hourglass -->
            <button id="nav-fridge" onclick="switchTab('fridge')" class="flex flex-col items-center justify-center w-20 h-full text-on-surface-variant hover:text-primary transition-colors focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/20 relative">
                <span class="material-symbols-outlined text-2xl transition-transform duration-200">hourglass_empty</span>
                <span class="text-[11px] font-bold mt-1">冰箱沙漏</span>
                <!-- Badge for urgent items count -->
                <span id="fridge-badge" class="absolute top-1 right-4 bg-rust-orange text-white text-[9px] font-extrabold w-4.5 h-4.5 flex items-center justify-center rounded-full border border-white hidden">0</span>
            </button>
            
            <!-- Tab: Kitchen -->
            <button id="nav-kitchen" onclick="switchTab('kitchen')" class="flex flex-col items-center justify-center w-20 h-full text-on-surface-variant hover:text-primary transition-colors focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/20">
                <span class="material-symbols-outlined text-2xl transition-transform duration-200">blender</span>
                <span class="text-[11px] font-bold mt-1">小廚房</span>
            </button>

            <!-- Tab: ROI Board -->
            <button id="nav-roi" onclick="switchTab('roi')" class="flex flex-col items-center justify-center w-20 h-full text-on-surface-variant hover:text-primary transition-colors focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/20">
                <span class="material-symbols-outlined text-2xl transition-transform duration-200">savings</span>
                <span class="text-[11px] font-bold mt-1">圓夢看板</span>
            </button>
        </div>
    </nav>

    <!-- Developer Tools Floating Menu & Trigger Modal -->
    <div id="dev-tools-fab" class="fixed bottom-20 right-4 z-50 flex flex-col items-end">
        <!-- Floating Dev Menu Panel (Hidden by default) -->
        <div id="dev-menu-panel" class="hidden mb-3 w-72 bg-slate-900 text-white rounded-2xl shadow-2xl border border-amber-500/30 p-4 space-y-3 backdrop-blur-md bg-opacity-95 text-xs animate-in fade-in slide-in-from-bottom-3 duration-200">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
                <span class="font-extrabold text-amber-400 flex items-center gap-1.5 text-sm">
                    <span class="material-symbols-outlined text-base">developer_mode</span>
                    開發者彈窗測試選單
                </span>
                <button onclick="toggleDevMenu()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800">
                    <span class="material-symbols-outlined text-sm">close</span>
                </button>
            </div>
            
            <div class="space-y-2">
                <p class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">1. 盤點與設定調整</p>
                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="SingleGoalApp.startOnboarding(); toggleDevMenu();" class="w-full bg-slate-800 hover:bg-indigo-600 text-slate-100 hover:text-white px-2.5 py-2 rounded-xl text-[11px] font-bold border border-slate-700 flex items-center gap-1 transition-all text-left">
                        <span class="material-symbols-outlined text-sm text-indigo-400">restart_alt</span>
                        重新盤點
                    </button>
                    <button onclick="SingleGoalApp.openSettings(); toggleDevMenu();" class="w-full bg-slate-800 hover:bg-indigo-600 text-slate-100 hover:text-white px-2.5 py-2 rounded-xl text-[11px] font-bold border border-slate-700 flex items-center gap-1 transition-all text-left">
                        <span class="material-symbols-outlined text-sm text-amber-400">tune</span>
                        計畫調整
                    </button>
                </div>
            </div>

            <div class="space-y-1.5">
                <p class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">2. 小廚房結算劃撥</p>
                <button onclick="SingleGoalApp.promptMealCompletion({ mealName: '開發者測試：高麗菜牛肉煲', homeCookCost: 45 }); toggleDevMenu();" class="w-full bg-slate-800 hover:bg-emerald-600 text-slate-100 hover:text-white px-3 py-2 rounded-xl text-[11px] font-bold border border-slate-700 flex items-center justify-between transition-all">
                    <span class="flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm text-emerald-400">skillet</span>
                        料理完成劃撥彈窗
                    </span>
                    <span class="text-[9px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded">測試</span>
                </button>
            </div>

            <div class="space-y-1.5">
                <p class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">3. 慶祝與解鎖</p>
                <button onclick="SingleGoalApp.openCompletionPrompt(); toggleDevMenu();" class="w-full bg-slate-800 hover:bg-amber-600 text-slate-100 hover:text-white px-3 py-2 rounded-xl text-[11px] font-bold border border-slate-700 flex items-center justify-between transition-all">
                    <span class="flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm text-amber-400">celebration</span>
                        圓夢達成慶祝彈窗
                    </span>
                    <span class="text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded">100%</span>
                </button>
            </div>
        </div>

        <!-- Floating Action Icon Button (FAB) -->
        <button onclick="toggleDevMenu()" title="開發者測試選單 (Dev Tools)" aria-label="開發者測試選單" class="bg-slate-900 hover:bg-slate-800 text-amber-400 border border-amber-500/40 p-3 rounded-full shadow-2xl transition-all duration-200 active:scale-95 flex items-center justify-center relative group focus:outline-none focus:ring-4 focus:ring-amber-400/30">
            <span class="material-symbols-outlined text-2xl group-hover:rotate-12 transition-transform">bug_report</span>
            <span class="absolute -top-1 -right-1 bg-amber-500 text-slate-900 text-[9px] font-black px-1.5 py-0.2 rounded-full border border-slate-900">DEV</span>
        </button>
    </div>

    <script>
        function toggleDevMenu() {
            const panel = document.getElementById('dev-menu-panel');
            if (panel) panel.classList.toggle('hidden');
        }
        window.toggleDevMenu = toggleDevMenu;
    </script>

    <!-- Supabase JS Client SDK -->
    <script src="./libs/supabase.js?v=2"></script>
    <!-- Core App Scripts -->
    <script src="./src/dream-space/single-goal.js?v=1"></script>
    <script src="./src/dream-space/single-goal-app.js?v=1"></script>
    <script src="./app.js?v=42"></script>
</body>
</html>
