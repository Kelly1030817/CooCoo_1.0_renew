services:
  - type: web
    name: coocoo-api-preview
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-3.7-flash
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_APP_NAME
        value: CooCoo
      - key: CATALOG_MODEL
        value: google/gemini-3.7-flash
      - key: CATALOG_USD_TO_TWD_RATE
        value: "35"
      - key: CATALOG_INPUT_USD_PER_MILLION
        value: "0.10"
      - key: CATALOG_OUTPUT_USD_PER_MILLION
        value: "0.40"
      - key: CATALOG_CRON_SECRET
        sync: false
