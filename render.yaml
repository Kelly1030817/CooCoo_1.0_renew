services:
  - type: web
    name: coocoo-api-preview
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-3.7-flash
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_APP_NAME
        value: CooCoo
  - type: cron
    name: coocoo-recipe-catalog-preview
    runtime: docker
    plan: starter
    schedule: "0 * * * *"
    dockerfilePath: ./Dockerfile.api
    dockerCommand: bun run apps/api/src/modules/catalog/worker.ts
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CATALOG_MODEL
        value: gemini-3.7-flash
      - key: CATALOG_USD_TO_TWD_RATE
        value: "35"
