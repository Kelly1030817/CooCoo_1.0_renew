services:
  - type: web
    name: coocoo-backend
    runtime: node
    rootDir: server
    buildCommand: npm ci --only=production
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /api/v1/health
