<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CooCoo 今日雙餐決策與 AI 主廚 · Throwaway Preview</title>
  <!--
    THROWAWAY UI PROTOTYPE — do not promote directly to production.
    Question: Which structure best joins current-meal choice, next-meal allocation,
    real AI consultation, cross-page continuity, and verified rewards on Today?
    Three variants are switchable with ?variant=A|B|C.
  -->
  <style>
    :root {
      --rice: #f7f1e5;
      --rice-2: #efe4d2;
      --paper: #fffdf7;
      --ink: #253b3a;
      --muted: #746f66;
      --line: #dacdb9;
      --lacquer: #a74732;
      --lacquer-dark: #7f3022;
      --jade: #326b59;
      --jade-soft: #dfece4;
      --yolk: #dfa735;
      --plum: #72546c;
      --danger: #a23f37;
      --shadow: 0 18px 48px rgba(51, 45, 37, .14);
      --sans: ui-rounded, "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      --serif: "Songti TC", "Noto Serif TC", Georgia, serif;
    }

    * { box-sizing: border-box; }
    html { background: #ddd2c1; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(255,255,255,.85), transparent 24rem),
        linear-gradient(135deg, #e8ddcc, #cfc4b5);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(50, 107, 89, .28);
      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .hidden { display: none !important; }

    .prototype-notice {
      position: fixed;
      z-index: 200;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 660px);
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      color: #fff;
      background: rgba(30, 39, 38, .88);
      backdrop-filter: blur(14px);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .03em;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.16);
    }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 58px 16px 96px;
    }
    .phone {
      position: relative;
      width: min(100%, 420px);
      height: min(860px, calc(100vh - 88px));
      min-height: 690px;
      overflow: hidden;
      border: 8px solid #252a28;
      border-radius: 38px;
      background: var(--rice);
      box-shadow: 0 28px 90px rgba(32, 35, 32, .24), inset 0 0 0 1px rgba(255,255,255,.4);
    }
    .screen {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-bottom: 98px;
      scrollbar-width: none;
    }
    .screen::-webkit-scrollbar { display: none; }

    .app-top {
      position: sticky;
      top: 0;
      z-index: 30;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(11px + env(safe-area-inset-top)) 16px 10px;
      border-bottom: 1px solid rgba(160, 137, 107, .16);
      background: rgba(247, 241, 229, .88);
      backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px 12px 12px 3px;
      color: #fff7db;
      background: var(--ink);
      font-size: 17px;
      box-shadow: 0 5px 12px rgba(37,59,58,.18);
    }
    .brand strong { display: block; font-family: var(--serif); font-size: 15px; }
    .brand small { display: block; margin-top: 1px; color: var(--muted); font-size: 9px; font-weight: 800; }
    .level-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,253,247,.8);
      color: var(--ink);
      font-size: 9px;
      font-weight: 900;
    }
    .level-ring {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: conic-gradient(var(--yolk) 0 72%, #e8dece 72%);
      font-size: 8px;
      box-shadow: inset 0 0 0 4px var(--paper);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--lacquer);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { text-wrap: balance; }
    .display {
      margin-bottom: 9px;
      font-family: var(--serif);
      font-size: clamp(27px, 8vw, 34px);
      line-height: 1.17;
      letter-spacing: -.035em;
    }
    .lede { margin-bottom: 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .section-title { margin: 0; font-family: var(--serif); font-size: 18px; letter-spacing: -.02em; }
    .section-copy { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }

    .chef-orb {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(223,167,53,.5);
      border-radius: 50% 50% 46% 46%;
      color: #fff8df;
      background: linear-gradient(145deg, #c57b32, #9a462e);
      box-shadow: 0 8px 20px rgba(167,71,50,.18);
      font-size: 20px;
    }
    .chef-summary {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border: 1px solid #dcc7aa;
      background: linear-gradient(140deg, #fff8e8, #f4e5c9);
      box-shadow: 0 8px 22px rgba(94, 77, 55, .08);
    }
    .chef-summary strong { display: block; margin-bottom: 4px; font-family: var(--serif); font-size: 14px; }
    .chef-summary p { margin: 0; color: #695d4d; font-size: 11px; line-height: 1.55; }
    .summary-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }

    .btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 14px;
      border: 0;
      border-radius: 13px;
      font-size: 11px;
      font-weight: 900;
      transition: transform .15s ease, filter .15s ease, background .15s ease;
    }
    .btn:active { transform: scale(.975); }
    .btn-primary { color: #fff; background: var(--lacquer); box-shadow: 0 7px 16px rgba(167,71,50,.18); }
    .btn-primary:hover { filter: brightness(.95); }
    .btn-dark { color: #fff; background: var(--ink); }
    .btn-jade { color: #fff; background: var(--jade); }
    .btn-ghost { color: var(--ink); border: 1px solid var(--line); background: rgba(255,255,255,.7); }
    .btn-link { min-height: auto; padding: 5px 0; color: var(--lacquer); background: transparent; }
    .btn-small { min-height: 32px; padding: 6px 10px; border-radius: 10px; font-size: 9px; }
    .btn-wide { width: 100%; }

    .card {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 8px 25px rgba(52, 47, 39, .07);
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 7px;
      border-radius: 999px;
      color: var(--jade);
      background: var(--jade-soft);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .04em;
    }
    .tag-lacquer { color: var(--lacquer-dark); background: #f4ded7; }
    .tag-yolk { color: #754f08; background: #f8e8b9; }
    .tag-muted { color: #69645b; background: #eee8de; }

    .bottom-nav {
      position: absolute;
      z-index: 35;
      left: 10px;
      right: 10px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 7px 4px;
      border: 1px solid rgba(200,185,163,.8);
      border-radius: 22px;
      background: rgba(255,253,247,.94);
      backdrop-filter: blur(18px);
      box-shadow: 0 10px 28px rgba(37,59,58,.15);
    }
    .nav-btn {
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 0;
      border-radius: 15px;
      color: #8b8378;
      background: transparent;
      font-size: 9px;
      font-weight: 900;
    }
    .nav-btn span:first-child { font-size: 16px; }
    .nav-btn.active { color: #fff; background: var(--ink); }

    .prototype-switcher {
      position: fixed;
      z-index: 210;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 42px minmax(180px, 250px) 42px;
      align-items: center;
      padding: 5px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      color: #fff;
      background: rgba(24, 31, 30, .94);
      box-shadow: 0 14px 36px rgba(0,0,0,.28);
      backdrop-filter: blur(18px);
    }
    .switch-btn { height: 36px; border: 0; border-radius: 50%; color: #fff; background: rgba(255,255,255,.1); font-size: 18px; }
    .switch-label { padding: 0 10px; text-align: center; font-size: 10px; font-weight: 900; letter-spacing: .04em; }
    .switch-label strong { color: #f1c462; }

    .task-strip {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid rgba(223,167,53,.52);
      border-radius: 15px;
      color: #fff9e8;
      background: var(--ink);
      box-shadow: 0 8px 20px rgba(37,59,58,.18);
    }
    .task-strip .task-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; color: var(--ink); background: var(--yolk); }
    .task-strip strong { display: block; font-size: 10px; }
    .task-strip small { display: block; margin-top: 2px; color: rgba(255,255,255,.68); font-size: 8px; }

    /* Variant A — a guided two-stop rail. */
    .variant-a { padding: 18px 15px 24px; }
    .variant-a .hero { padding: 12px 3px 17px; }
    .variant-a .chef-summary { padding: 13px; border-radius: 20px; }
    .choice-heading { display: flex; align-items: flex-end; justify-content: space-between; margin: 20px 2px 10px; }
    .choice-heading small { color: var(--muted); font-size: 9px; font-weight: 800; }
    .meal-rail { position: relative; display: grid; gap: 10px; padding-left: 19px; }
    .meal-rail::before { content: ""; position: absolute; top: 16px; bottom: 18px; left: 7px; width: 2px; background: linear-gradient(var(--lacquer), var(--yolk), var(--jade)); }
    .meal-option {
      position: relative;
      width: 100%;
      display: grid;
      grid-template-columns: 58px 1fr auto;
      gap: 11px;
      align-items: center;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--ink);
      background: rgba(255,253,247,.88);
      text-align: left;
      box-shadow: 0 5px 18px rgba(54,45,35,.06);
    }
    .meal-option::before { content: ""; position: absolute; left: -18px; width: 11px; height: 11px; border: 3px solid var(--rice); border-radius: 50%; background: var(--lacquer); box-shadow: 0 0 0 1px var(--lacquer); }
    .meal-option.selected { border-color: var(--lacquer); background: #fff8ee; box-shadow: 0 8px 26px rgba(167,71,50,.13); }
    .meal-art { height: 58px; display: grid; place-items: center; border-radius: 14px; background: #ece4d6; font-size: 29px; }
    .meal-option strong { display: block; font-family: var(--serif); font-size: 14px; }
    .meal-option small { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.45; }
    .meal-option b { color: var(--lacquer); font-size: 12px; }
    .next-invite { margin-top: 13px; padding: 15px; }
    .next-invite-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .next-invite .route-line { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); font-size: 9px; font-weight: 800; }

    /* Variant B — a literal two-compartment bento decision board. */
    .variant-b { padding: 14px 13px 28px; }
    .variant-b .bento-hero { position: relative; overflow: hidden; padding: 20px 16px 16px; border-radius: 24px; color: #fff; background: var(--ink); }
    .bento-hero::after { content: "今日\A 配膳"; white-space: pre; position: absolute; right: 13px; top: 16px; color: rgba(255,255,255,.07); font-family: var(--serif); font-size: 40px; font-weight: 900; line-height: .9; }
    .variant-b .display { max-width: 280px; color: #fff8e9; }
    .variant-b .lede { max-width: 270px; color: rgba(255,255,255,.67); }
    .bento-chef { position: relative; z-index: 1; display: flex; gap: 9px; align-items: center; margin-top: 14px; padding: 9px 11px; border: 1px solid rgba(255,255,255,.13); border-radius: 14px; background: rgba(255,255,255,.07); }
    .bento-chef p { margin: 0; color: rgba(255,255,255,.82); font-size: 9px; line-height: 1.45; }
    .bento-board { margin-top: 12px; padding: 8px; border: 1px solid #c9b898; border-radius: 26px; background: #d9c29c; box-shadow: inset 0 0 0 2px rgba(255,255,255,.32), var(--shadow); }
    .bento-grid { display: grid; grid-template-columns: 1.12fr .88fr; gap: 7px; min-height: 305px; }
    .bento-main, .bento-next { border-radius: 20px; background: var(--paper); }
    .bento-main { display: flex; flex-direction: column; padding: 14px; }
    .bento-next { display: flex; flex-direction: column; gap: 7px; padding: 9px; }
    .bento-label { color: var(--lacquer); font-size: 9px; font-weight: 900; letter-spacing: .12em; }
    .bento-main h2 { margin: 10px 0 4px; font-family: var(--serif); font-size: 21px; }
    .bento-main p { color: var(--muted); font-size: 9px; line-height: 1.5; }
    .bento-main .dish { flex: 1; min-height: 95px; display: grid; place-items: center; margin: 8px 0; border-radius: 18px; background: radial-gradient(circle, #f7dca5, #e8ba66); font-size: 48px; }
    .mini-option { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; border: 1px solid var(--line); border-radius: 15px; background: #f6f0e6; }
    .mini-option.selected { border-color: var(--jade); background: var(--jade-soft); }
    .mini-option span { font-size: 20px; }
    .mini-option strong { font-size: 10px; }
    .mini-option small { color: var(--muted); font-size: 8px; line-height: 1.35; }
    .bento-action-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px; }
    .bento-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 10px; }
    .bento-choice { padding: 9px 5px; border: 1px solid var(--line); border-radius: 13px; color: var(--ink); background: rgba(255,253,247,.7); font-size: 8px; font-weight: 900; }

    /* Variant C — chat-first, with the plan kept as a calm receipt. */
    .variant-c { padding: 13px 14px 28px; }
    .variant-c .chat-hero { overflow: hidden; border: 1px solid #d7c4a7; border-radius: 26px; background: #fffaf0; box-shadow: var(--shadow); }
    .chat-hero-head { display: flex; align-items: center; justify-content: space-between; padding: 14px; color: #fff; background: linear-gradient(145deg, var(--lacquer-dark), var(--lacquer)); }
    .chat-hero-head .chef-orb { width: 38px; height: 38px; background: rgba(255,255,255,.14); box-shadow: none; }
    .chat-identity { flex: 1; margin-left: 10px; }
    .chat-identity strong { display: block; font-family: var(--serif); font-size: 14px; }
    .chat-identity small { color: rgba(255,255,255,.72); font-size: 8px; }
    .online { width: 8px; height: 8px; border: 2px solid rgba(255,255,255,.3); border-radius: 50%; background: #8be0a6; }
    .chat-preview { padding: 13px; }
    .bubble { max-width: 88%; padding: 10px 11px; border-radius: 16px 16px 16px 4px; color: #514a40; background: #f0e5d2; font-size: 10px; line-height: 1.55; }
    .action-proposal { margin-top: 10px; padding: 11px; border: 1px solid rgba(50,107,89,.32); border-radius: 16px; background: #edf5ef; }
    .action-proposal strong { display: block; font-size: 10px; }
    .action-proposal p { margin: 4px 0 9px; color: #587064; font-size: 9px; line-height: 1.45; }
    .chat-compose-fake { display: grid; grid-template-columns: 1fr auto; gap: 7px; margin-top: 12px; padding-top: 11px; border-top: 1px solid #eadfce; }
    .chat-compose-fake span { padding: 10px; border: 1px solid var(--line); border-radius: 12px; color: #938a7e; background: #fff; font-size: 9px; }
    .variant-c .display { margin-top: 19px; font-size: 27px; }
    .receipt-plan { position: relative; margin-top: 12px; padding: 15px; border-radius: 6px 6px 18px 18px; background: var(--paper); box-shadow: 0 12px 30px rgba(51,45,37,.12); }
    .receipt-plan::before { content: ""; position: absolute; top: -7px; left: 0; right: 0; height: 8px; background: linear-gradient(135deg, transparent 5px, var(--paper) 0) 0 0/10px 8px repeat-x; }
    .receipt-row { display: grid; grid-template-columns: 70px 1fr auto; gap: 7px; padding: 10px 0; border-bottom: 1px dashed #d8ccba; align-items: center; }
    .receipt-row:last-child { border-bottom: 0; }
    .receipt-row > span { color: var(--muted); font-size: 9px; font-weight: 900; }
    .receipt-row strong { font-family: var(--serif); font-size: 12px; }
    .receipt-row button { border: 0; color: var(--lacquer); background: transparent; font-size: 9px; font-weight: 900; }

    /* Shared sheets and full flows. */
    .overlay {
      position: absolute;
      z-index: 80;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding: 12px;
      background: rgba(24, 31, 30, .48);
      backdrop-filter: blur(5px);
    }
    .sheet {
      width: 100%;
      max-height: 88%;
      overflow-y: auto;
      padding: 17px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 26px 26px 20px 20px;
      background: var(--rice);
      box-shadow: 0 -16px 50px rgba(28,35,33,.22);
      animation: sheetIn .26s cubic-bezier(.2,.85,.25,1);
    }
    @keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } }
    .sheet-grab { width: 40px; height: 4px; margin: -8px auto 14px; border-radius: 99px; background: #cbbca7; }
    .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .icon-close { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); background: var(--paper); }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 14px; }
    .field { display: grid; gap: 5px; color: var(--muted); font-size: 9px; font-weight: 900; }
    .field input, .field select {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: var(--paper);
    }
    .strategy-grid { display: grid; gap: 8px; margin-top: 14px; }
    .strategy {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--ink);
      background: var(--paper);
      text-align: left;
    }
    .strategy.selected { border-color: var(--jade); background: var(--jade-soft); }
    .strategy > span:first-child { font-size: 22px; }
    .strategy strong { display: block; font-size: 10px; }
    .strategy small { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }
    .strategy b { color: var(--jade); font-size: 13px; }

    .chat-sheet { height: 92%; display: flex; flex-direction: column; padding: 0; overflow: hidden; }
    .chat-sheet-top { display: flex; align-items: center; gap: 10px; padding: 14px; color: #fff; background: var(--ink); }
    .chat-sheet-top .chat-identity small { color: rgba(255,255,255,.65); }
    .chat-tools { display: flex; gap: 5px; margin-left: auto; }
    .chat-tools button { min-width: 30px; height: 30px; border: 1px solid rgba(255,255,255,.18); border-radius: 9px; color: #fff; background: rgba(255,255,255,.08); font-size: 9px; }
    .chat-limit { padding: 7px 13px; border-bottom: 1px solid var(--line); color: var(--muted); background: #f3ebde; font-size: 8px; font-weight: 900; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px; }
    .message { max-width: 86%; padding: 10px 11px; border-radius: 16px; font-size: 10px; line-height: 1.58; white-space: pre-line; }
    .message.chef { align-self: flex-start; border-radius: 16px 16px 16px 4px; color: #504a42; background: #eee3d2; }
    .message.user { align-self: flex-end; border-radius: 16px 16px 4px 16px; color: #fff; background: var(--lacquer); }
    .message.system { align-self: center; color: var(--muted); background: transparent; font-size: 8px; }
    .chat-action-card { align-self: flex-start; width: 92%; padding: 11px; border: 1px solid rgba(50,107,89,.35); border-radius: 16px; background: #edf5ef; }
    .chat-action-card strong { display: block; font-size: 10px; }
    .chat-action-card p { margin: 4px 0 9px; color: #587064; font-size: 9px; line-height: 1.45; }
    .chat-compose { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 11px; border-top: 1px solid var(--line); background: rgba(255,253,247,.96); }
    .chat-compose textarea { min-height: 44px; max-height: 92px; resize: none; padding: 11px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: #fff; font-size: 11px; }
    .send-btn { width: 44px; border: 0; border-radius: 14px; color: #fff; background: var(--lacquer); font-weight: 900; }

    .flow-screen {
      position: absolute;
      z-index: 70;
      inset: 0;
      overflow-y: auto;
      padding-bottom: 86px;
      color: var(--ink);
      background: var(--rice);
    }
    .flow-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid var(--line); background: rgba(247,241,229,.94); backdrop-filter: blur(16px); }
    .flow-head button { width: 35px; height: 35px; border: 1px solid var(--line); border-radius: 50%; color: var(--ink); background: var(--paper); }
    .flow-head strong { font-family: var(--serif); font-size: 15px; }
    .flow-body { padding: 14px; }
    .shopping-list { display: grid; gap: 8px; margin-top: 14px; }
    .shopping-item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 12px; }
    .shopping-item input { width: 18px; height: 18px; accent-color: var(--jade); }
    .shopping-item strong { display: block; font-size: 11px; }
    .shopping-item small { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }
    .shopping-item b { font-size: 10px; }
    .sticky-action { position: sticky; bottom: 0; display: grid; gap: 7px; padding: 11px 14px calc(11px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: rgba(255,253,247,.96); backdrop-filter: blur(16px); }

    .cook-step { margin-bottom: 12px; padding: 17px; }
    .cook-step .step-no { color: var(--lacquer); font-size: 9px; font-weight: 900; letter-spacing: .12em; }
    .cook-step h2 { margin: 9px 0 11px; font-family: var(--serif); font-size: 23px; line-height: 1.35; }
    .ingredient-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .ingredient-pills span { padding: 5px 8px; border-radius: 999px; color: #685f53; background: #f0e8da; font-size: 8px; font-weight: 900; }
    .cook-progress { display: flex; gap: 5px; margin: 11px 0 16px; }
    .cook-progress i { height: 4px; flex: 1; border-radius: 99px; background: #ded3c2; }
    .cook-progress i.done { background: var(--lacquer); }

    .reward {
      text-align: center;
      background: linear-gradient(155deg, #fffdf7, #f4e4c8);
    }
    .trophy { width: 76px; height: 76px; display: grid; place-items: center; margin: 3px auto 12px; border-radius: 28px 28px 28px 9px; background: #f6d98f; box-shadow: 0 12px 26px rgba(153,105,32,.18); font-size: 36px; }
    .reward-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 14px 0; text-align: left; }
    .reward-cell { padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.7); }
    .reward-cell small { display: block; color: var(--muted); font-size: 7px; font-weight: 900; }
    .reward-cell strong { display: block; margin-top: 4px; font-size: 12px; }
    .xp-reveal { padding: 11px; border-radius: 16px; color: #fff; background: var(--ink); }
    .xp-reveal strong { color: #f5c960; font-size: 20px; }
    .xp-bar { height: 6px; overflow: hidden; margin-top: 8px; border-radius: 99px; background: rgba(255,255,255,.15); }
    .xp-bar span { display: block; width: 42%; height: 100%; border-radius: inherit; background: var(--yolk); }

    .toast {
      position: absolute;
      z-index: 140;
      left: 50%;
      bottom: 88px;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 28px);
      padding: 10px 13px;
      border-radius: 13px;
      color: #fff;
      background: rgba(37,59,58,.96);
      box-shadow: 0 10px 28px rgba(0,0,0,.2);
      font-size: 9px;
      font-weight: 900;
      text-align: center;
      animation: toastIn .22s ease;
    }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } }

    @media (max-width: 520px) {
      body { background: var(--rice); }
      .stage { display: block; padding: 0; }
      .prototype-notice { top: 6px; width: calc(100% - 18px); font-size: 9px; }
      .phone { width: 100%; height: 100dvh; min-height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
      .prototype-switcher { bottom: 7px; grid-template-columns: 38px minmax(160px, 220px) 38px; }
      .bottom-nav { bottom: 58px; }
      .screen { padding-bottom: 147px; }
      .flow-screen { padding-bottom: 138px; }
      .toast { bottom: 145px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }

</head>
<body>
  <div class="prototype-notice">THROWAWAY PREVIEW · 所有互動只存在這個頁面，不會寫入正式帳號</div>
  <main class="stage">
    <div class="phone" id="phone">
      <div class="screen" id="screen"></div>
      <nav class="bottom-nav" id="bottom-nav" aria-label="主要功能"></nav>
      <div id="overlay-root"></div>
      <div id="toast-root"></div>
    </div>
  </main>
  <div class="prototype-switcher" aria-label="預覽方案切換">
    <button class="switch-btn" id="prev-variant" aria-label="上一個方案">←</button>
    <div class="switch-label" id="variant-label"></div>
    <button class="switch-btn" id="next-variant" aria-label="下一個方案">→</button>
  </div>

  <script>
    const variants = [
      { key: 'A', name: '雙餐接力線' },
      { key: 'B', name: '便當配膳板' },
      { key: 'C', name: '相談室先行' },
    ];

    const state = {
      variant: new URLSearchParams(location.search).get('variant') || 'A',
      route: 'today',
      selected: 'prepared',
      nextStrategy: 'batch',
      nextDate: '2026-09-11',
      nextSlot: 'lunch',
      servings: 2,
      task: null,
      shoppingReady: false,
      cookStep: 0,
      chatCount: 23,
      chatHistory: [
        { id: 1, title: '今天很累，想吃快一點', meta: '今天 18:42 · 低體力方案' },
        { id: 2, title: '明天午餐想帶便當', meta: '昨天 21:10 · 雙餐規劃' },
        { id: 3, title: '青蔥快過期怎麼用', meta: '9 月 8 日 · 即期救援' },
        { id: 4, title: '今晚不想煮', meta: '9 月 7 日 · 外食備援' },
      ],
      exp: 0,
      level: 1,
    };

    const optionData = {
      prepared: { icon: '🍲', title: '番茄豆腐燴飯', meta: '熟食 1 份 · 昨晚完成 · 建議今天吃', cost: '5 分鐘', tag: '最少浪費' },
      inventory: { icon: '🍜', title: '青蔥蛋香烏龍麵', meta: '冰箱覆蓋 100% · 使用即期青蔥', cost: '18 分鐘', tag: '不用買' },
      purchase: { icon: '🥬', title: '高麗菜豆腐鍋', meta: '補買金針菇 1 項 · 約 NT$ 35', cost: '25 分鐘', tag: '多煮友善' },
    };

    const recipeData = {
      prepared: {
        steps: [
          ['確認 01','確認熟食氣味與外觀，準備重新加熱。','番茄豆腐燴飯'],
          ['加熱 02','加熱至中心完全熱透，中途翻拌一次。','熟食 · 少量清水'],
          ['盛盤 03','盛盤後再次確認溫度，這餐直接吃完。','番茄豆腐燴飯'],
        ],
      },
      inventory: {
        steps: [
          ['備料 01','青蔥切小段，雞蛋打散。','青蔥 · 雞蛋 2 顆'],
          ['下鍋 02','電子鍋加熱後炒香青蔥，再倒入蛋液。','食用油 · 青蔥 · 蛋液'],
          ['合體 03','加入烏龍麵與少量醬油，拌至完全加熱。','烏龍麵 · 醬油'],
        ],
      },
      purchase: {
        steps: [
          ['備料 01','高麗菜切片，豆腐切塊，金針菇去蒂。','高麗菜 · 豆腐 · 金針菇'],
          ['煮湯 02','鍋中加入高湯，先煮高麗菜至稍微變軟。','高湯 · 高麗菜'],
          ['合體 03','加入豆腐與金針菇，煮熟後調味。','豆腐 · 金針菇 · 鹽'],
        ],
      },
    };

    function appTop() {
      return `
        <header class="app-top">
          <div class="brand"><span class="brand-mark">火</span><div><strong>CooCoo 煮煮</strong><small>下一餐也一起照顧</small></div></div>
          <button class="level-chip" onclick="openProgress()"><span class="level-ring" style="background:conic-gradient(var(--yolk) 0 ${Math.min(state.exp, 100)}%, #e8dece ${Math.min(state.exp, 100)}%)">${state.exp}</span><span>Lv.${state.level}<br>${state.level === 1 ? '開伙見習生' : '一鍋行動派'}</span></button>
        </header>`;
    }

    function taskStrip() {
      if (!state.task) return '';
      const step = state.task.status === 'needs_shopping' ? '下一步：補買金針菇' : state.task.status === 'ready' ? '食材已齊 · 可以開始料理' : '下一步：開始今天的料理';
      return `<div class="task-strip"><span class="task-icon">✦</span><div><strong>進行中 · ${state.task.title}</strong><small>${step}</small></div><button class="btn btn-small btn-ghost" onclick="goToday()">查看</button></div>`;
    }

    function chefSummary(compact = false) {
      return `<div class="chef-summary">
        <span class="chef-orb">♨</span>
        <div><strong>${compact ? '主廚今天的判斷' : '先吃昨晚的熟食，最省力也最不浪費。'}</strong>
          <p>${compact ? '有 1 份熟食建議今天吃；青蔥剩 2 天，下一餐可用來煮烏龍麵。' : '如果想開火，我也準備了兩個安全選擇。今天還能順手替明天午餐多煮一份。'}</p>
          <div class="summary-actions"><button class="btn btn-small btn-primary" onclick="openChat()">跟 AI 主廚聊聊</button><button class="btn btn-small btn-ghost" onclick="showToast('外食保留為次要選項，不會自動扣款')">今晚改外食</button></div>
        </div>
      </div>`;
    }

    function mealOption(key) {
      const item = optionData[key];
      return `<button class="meal-option ${state.selected === key ? 'selected' : ''}" onclick="selectMeal('${key}')">
        <span class="meal-art">${item.icon}</span><span><span class="tag ${key === 'purchase' ? 'tag-yolk' : ''}">${item.tag}</span><strong>${item.title}</strong><small>${item.meta}</small></span><b>${item.cost}</b>
      </button>`;
    }

    function renderVariantA() {
      return `${appTop()}<div class="variant-a">
        ${taskStrip()}
        <section class="hero"><p class="eyebrow">今天 · 晚餐決策</p><h1 class="display">先照顧這一餐，<br>再替下一餐留一手。</h1><p class="lede">不用規劃完整一週。從現在的體力、冰箱與時間，做一個剛剛好的分配。</p></section>
        ${chefSummary()}
        <div class="choice-heading"><div><p class="eyebrow">這一餐</p><h2 class="section-title">主廚挑出的三個方向</h2></div><small>平衡期限 · 體力 · 預算</small></div>
        <div class="meal-rail">${mealOption('prepared')}${mealOption('inventory')}${mealOption('purchase')}</div>
        <section class="card next-invite"><div class="next-invite-head"><div><p class="eyebrow">下一餐 · 可跳過</p><h2 class="section-title">要不要順手安排？</h2><p class="section-copy">手動選時間，再決定多煮一份或另外選菜。</p></div><span class="chef-orb" style="width:38px;height:38px;font-size:16px">＋1</span></div><div class="route-line"><span>今晚吃</span><b>→</b><span>明天午餐有著落</span></div><button class="btn btn-dark btn-wide" style="margin-top:12px" onclick="openAllocation()">安排這餐與下一餐</button></section>
      </div>`;
    }

    function renderVariantB() {
      const item = optionData[state.selected];
      return `${appTop()}<div class="variant-b">
        ${taskStrip()}
        <section class="bento-hero"><p class="eyebrow" style="color:#f5c960">雙餐配膳</p><h1 class="display">一個決定，<br>分成兩餐的從容。</h1><p class="lede">左邊處理現在，右邊替下一餐留位置。</p><div class="bento-chef"><span class="chef-orb" style="width:34px;height:34px;font-size:15px">♨</span><p>主廚建議：熟食先吃；若今天想開火，青蔥蛋香烏龍麵最符合目前庫存。</p><button class="btn btn-small btn-ghost" onclick="openChat()">相談</button></div></section>
        <div class="bento-board"><div class="bento-grid"><section class="bento-main"><span class="bento-label">NOW · 這一餐</span><h2>${item.title}</h2><p>${item.meta}</p><div class="dish">${item.icon}</div><span class="tag">${item.tag}</span></section><section class="bento-next"><span class="bento-label">NEXT · 下一餐</span><button class="mini-option ${state.nextStrategy === 'batch' ? 'selected' : ''}" onclick="setStrategy('batch')"><span>🍱</span><strong>順便多煮</strong><small>明天午餐預留 1 份</small></button><button class="mini-option ${state.nextStrategy === 'separate' ? 'selected' : ''}" onclick="setStrategy('separate')"><span>🥘</span><strong>另外選一道</strong><small>保留時間，不先扣庫存</small></button></section></div><div class="bento-action-row"><button class="btn btn-dark" onclick="openAllocation()">確認雙餐配膳</button><button class="btn btn-ghost" onclick="skipNext()">只處理這餐</button></div></div>
        <div class="bento-actions"><button class="bento-choice" onclick="selectMeal('prepared')">🍲<br>吃熟食</button><button class="bento-choice" onclick="selectMeal('inventory')">🍜<br>冰箱開火</button><button class="bento-choice" onclick="selectMeal('purchase')">🥬<br>少量補買</button></div>
      </div>`;
    }

    function renderVariantC() {
      return `${appTop()}<div class="variant-c">
        ${taskStrip()}
        <section class="chat-hero"><header class="chat-hero-head"><span class="chef-orb">♨</span><div class="chat-identity"><strong>主廚 CooCoo 相談室</strong><small>規則摘要開場 · AI 在你送出後才啟動</small></div><span class="online"></span></header><div class="chat-preview"><div class="bubble">你有一份昨晚的番茄豆腐燴飯，建議今天吃完。青蔥剩 2 天；如果想替明天午餐準備，我可以幫你把份量算好。</div><div class="action-proposal"><strong>建議組合</strong><p>今晚吃熟食 · 明天午餐另煮青蔥蛋香烏龍麵</p><button class="btn btn-small btn-jade" onclick="openAllocation()">查看並確認</button></div><div class="chat-compose-fake" onclick="openChat()"><span>告訴主廚：今天有多累、下一餐想何時吃…</span><button class="btn btn-small btn-primary">開始聊</button></div></div></section>
        <p class="eyebrow" style="margin-top:20px">主廚整理後的餐券</p><h1 class="display">你做決定，<br>AI 負責把路排清楚。</h1>
        <section class="receipt-plan"><div class="receipt-row"><span>這一餐</span><strong>${optionData[state.selected].title}</strong><button onclick="cycleMeal()">更換</button></div><div class="receipt-row"><span>下一餐</span><strong>${state.nextStrategy === 'batch' ? '同一道 · 預計留 1 份' : '明天午餐 · 另外選菜'}</strong><button onclick="openAllocation()">調整</button></div><div class="receipt-row"><span>任務狀態</span><strong>${state.task ? '已建立 · ' + state.task.title : '尚未建立'}</strong><button onclick="openAllocation()">${state.task ? '查看' : '建立'}</button></div><button class="btn btn-dark btn-wide" style="margin-top:12px" onclick="openChat()">打開完整 AI 相談室</button><button class="btn btn-link btn-wide" onclick="showToast('今晚外食：保留餐期，不新增扣款')">今晚改外食</button></section>
      </div>`;
    }

    function renderRoute() {
      const screen = document.getElementById('screen');
      if (state.route !== 'today') {
        renderSecondaryRoute();
        return;
      }
      screen.innerHTML = state.variant === 'B' ? renderVariantB() : state.variant === 'C' ? renderVariantC() : renderVariantA();
      renderNav();
      updateVariantLabel();
    }

    function renderNav() {
      const nav = document.getElementById('bottom-nav');
      const items = [
        ['today','⌂','今日'], ['shopping','▣','採買'], ['fridge','□','冰箱'], ['kitchen','♨','廚房'], ['dream','◎','圓夢']
      ];
      nav.innerHTML = items.map(([key, icon, label]) => `<button class="nav-btn ${state.route === key ? 'active' : ''}" onclick="goRoute('${key}')"><span>${icon}</span><span>${label}</span></button>`).join('');
    }

    function renderSecondaryRoute() {
      const titles = { shopping: ['市場陪伴','只買任務真的用得到的。'], fridge: ['冰箱沙漏','看見每一份食材的下一站。'], kitchen: ['料理流理台','跟著今天的任務開始。'], dream: ['圓夢看板','每一次完成，都留下真實進度。'] };
      const [eye, title] = titles[state.route];
      let body = '';
      if (state.route === 'shopping') {
        body = `<div class="shopping-list"><label class="card shopping-item"><input type="checkbox" checked><span><strong>金針菇</strong><small>任務補買 · 1 包</small></span><b>NT$ 35</b></label><label class="card shopping-item"><input type="checkbox"><span><strong>雞蛋</strong><small>冰箱已有 · 先不用買</small></span><b>保留</b></label></div><button class="btn btn-jade btn-wide" style="margin-top:12px" onclick="completeRestock()">完成補買並入庫</button>${state.shoppingReady ? `<div class="card" style="padding:13px;margin-top:10px"><strong style="font-size:11px">食材已齊，原本的任務可以繼續</strong><p class="section-copy">你可以返回 Today 查看分配，或直接開始料理。</p><div class="summary-actions"><button class="btn btn-small btn-ghost" onclick="goToday()">返回任務</button><button class="btn btn-small btn-primary" onclick="startCooking()">直接開始料理</button></div></div>` : ''}`;
      } else if (state.route === 'kitchen') {
        body = `<div class="card" style="padding:15px;margin-top:14px"><span class="tag">今日任務</span><h2 class="section-title" style="margin-top:9px">${state.task ? state.task.title : optionData[state.selected].title}</h2><p class="section-copy">預計料理 ${state.servings} 份；完成後再確認這餐吃掉與下一餐留下的份數。</p><button class="btn btn-primary btn-wide" style="margin-top:13px" onclick="startCooking()">下載並開始料理</button></div>`;
      } else if (state.route === 'dream') {
        body = `<div class="card" style="padding:16px;margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center"><div><p class="eyebrow">Lv.${state.level}</p><h2 class="section-title">${state.level === 1 ? '開伙見習生' : '一鍋行動派'}</h2></div><span style="font-size:35px">🎟️</span></div><p class="section-copy">${state.exp} / 100 EXP · 新帳制從 0 開始，不回溯舊資料。</p><div class="xp-bar" style="background:#e8dece"><span style="width:${Math.min(state.exp, 100)}%"></span></div></div><p class="eyebrow" style="margin-top:18px">徽章牆</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="card" style="padding:12px"><b>🍳 第一餐</b><p class="section-copy">${state.exp >= 30 ? '已解鎖' : '完成料理後解鎖'}</p></div><div class="card" style="padding:12px"><b>🍲 熟食不浪費</b><p class="section-copy">吃掉熟食後解鎖</p></div><div class="card" style="padding:12px"><b>🌱 即期救援王</b><p class="section-copy">0 / 3</p></div><div class="card" style="padding:12px"><b>🍱 雙餐接力</b><p class="section-copy">吃掉下一餐後解鎖</p></div></div>`;
      } else {
        body = `<div class="card" style="padding:15px;margin-top:14px"><span class="tag tag-yolk">熟食 1 份</span><h2 class="section-title" style="margin-top:9px">番茄豆腐燴飯</h2><p class="section-copy">昨晚完成 · 冷藏 · 建議今天吃完 · 保存資訊已確認</p><button class="btn btn-jade btn-wide" style="margin-top:12px" onclick="consumePrepared()">加熱後確認吃掉</button></div><div class="card" style="padding:15px;margin-top:10px"><span class="tag tag-lacquer">剩 2 天</span><h2 class="section-title" style="margin-top:9px">青蔥</h2><p class="section-copy">主廚已把它排進下一餐的烏龍麵。</p></div>`;
      }
      document.getElementById('screen').innerHTML = `${appTop()}<div style="padding:16px">${taskStrip()}<section style="padding:18px 2px 8px"><p class="eyebrow">${eye}</p><h1 class="display">${title}</h1></section>${body}</div>`;
      renderNav();
    }

    function selectMeal(key) { state.selected = key; renderRoute(); showToast(`已選「${optionData[key].title}」`); }
    function cycleMeal() { state.selected = state.selected === 'prepared' ? 'inventory' : state.selected === 'inventory' ? 'purchase' : 'prepared'; renderRoute(); }
    function setStrategy(key) { state.nextStrategy = key; renderRoute(); }
    function skipNext() { state.nextStrategy = 'none'; openAllocation(); }
    function goRoute(route) { state.route = route; renderRoute(); }
    function goToday() { state.route = 'today'; renderRoute(); }

    function openAllocation() {
      const item = optionData[state.selected];
      document.getElementById('overlay-root').innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="安排這餐與下一餐"><section class="sheet"><div class="sheet-grab"></div><header class="sheet-head"><div><p class="eyebrow">雙餐分配</p><h2 class="section-title">${item.title}</h2><p class="section-copy">規劃只會先保留方向，不會提前扣除食材。</p></div><button class="icon-close" onclick="closeOverlay()" aria-label="關閉">×</button></header><div class="field-grid"><label class="field">下一餐日期<input id="next-date" type="date" value="${state.nextDate}"></label><label class="field">餐期<select id="next-slot"><option value="breakfast">早餐</option><option value="lunch" selected>午餐</option><option value="dinner">晚餐</option></select></label><label class="field">預計料理總份數<input id="servings" type="number" min="1" max="12" value="${state.servings}"></label><label class="field">本餐人數<input type="number" min="1" max="12" value="1"></label></div><div class="strategy-grid"><button class="strategy ${state.nextStrategy === 'batch' ? 'selected' : ''}" onclick="selectAllocationStrategy('batch')"><span>🍱</span><span><strong>順便多煮</strong><small>完成後才確認實際留下幾份</small></span><b>推薦</b></button><button class="strategy ${state.nextStrategy === 'separate' ? 'selected' : ''}" onclick="selectAllocationStrategy('separate')"><span>🥘</span><span><strong>下一餐另外選菜</strong><small>保留時間，依剩餘庫存重新推薦</small></span><b>→</b></button><button class="strategy ${state.nextStrategy === 'none' ? 'selected' : ''}" onclick="selectAllocationStrategy('none')"><span>—</span><span><strong>這次先跳過</strong><small>只完成這一餐，之後再安排</small></span><b></b></button></div><div style="display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:14px"><button class="btn btn-ghost" onclick="closeOverlay()">稍後再說</button><button class="btn btn-primary" onclick="confirmTask()">建立今天的任務</button></div></section></div>`;
    }

    function selectAllocationStrategy(strategy) { state.nextStrategy = strategy; openAllocation(); }
    function confirmTask() {
      const date = document.getElementById('next-date');
      const servings = document.getElementById('servings');
      if (date) state.nextDate = date.value;
      if (servings) state.servings = Number(servings.value) || 1;
      const item = optionData[state.selected];
      state.task = { title: item.title, status: state.selected === 'purchase' ? 'needs_shopping' : 'ready' };
      closeOverlay();
      renderRoute();
      showToast(state.nextStrategy === 'none' ? '這一餐任務已建立' : '這餐與下一餐已先安排，不會預扣庫存');
    }

    function openChat() {
      document.getElementById('overlay-root').innerHTML = `<div class="overlay" style="padding:8px" role="dialog" aria-modal="true" aria-label="主廚 CooCoo AI 相談室"><section class="sheet chat-sheet"><header class="chat-sheet-top"><span class="chef-orb" style="width:36px;height:36px;font-size:16px">♨</span><div class="chat-identity"><strong>主廚 CooCoo</strong><small>真 AI 對話預覽 · 所有操作先確認</small></div><div class="chat-tools"><button onclick="openChatHistory()">歷史</button><button onclick="clearChatHistory()">清除</button><button onclick="closeOverlay()" aria-label="關閉">×</button></div></header><div class="chat-limit" id="chat-limit">今天已使用 ${state.chatCount} / 30 則 · 第 25 與 29 則後會提醒</div><div class="chat-messages" id="chat-messages"><div class="message chef">今晚有一份熟食建議先吃；青蔥剩 2 天。你可以直接告訴我：「今天很累」、「明天要帶便當」，或任何實際狀況。</div><div class="message system">規則摘要 · 尚未使用 AI 額度</div></div><div class="chat-compose"><textarea id="chat-input" rows="1" placeholder="例如：今天很累，但明天午餐想帶便當"></textarea><button class="send-btn" onclick="sendChat()" aria-label="送出">➤</button></div></section></div>`;
      setTimeout(() => document.getElementById('chat-input')?.focus(), 80);
    }

    function openChatHistory() {
      const rows = state.chatHistory.length
        ? state.chatHistory.map(item => `<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px"><div><strong style="font-size:10px">${item.title}</strong><p class="section-copy" style="margin:3px 0 0">${item.meta}</p></div><button class="btn btn-small btn-ghost" aria-label="刪除 ${item.title}" onclick="deleteConversation(${item.id})">刪除</button></div>`).join('')
        : `<div class="card" style="padding:18px;text-align:center"><strong style="font-size:11px">目前沒有相談紀錄</strong><p class="section-copy">新的相談只會保留最近 10 次。</p></div>`;
      document.getElementById('overlay-root').innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="相談歷史"><section class="sheet"><div class="sheet-grab"></div><header class="sheet-head"><div><p class="eyebrow">最近 ${state.chatHistory.length} / 10 次</p><h2 class="section-title">相談歷史</h2></div><button class="icon-close" onclick="openChat()" aria-label="返回相談室">×</button></header><div style="display:grid;gap:8px">${rows}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px"><button class="btn btn-ghost" onclick="clearChatHistory()">全部清除</button><button class="btn btn-primary" onclick="openChat()">返回相談室</button></div></section></div>`;
    }

    function deleteConversation(id) { state.chatHistory = state.chatHistory.filter(item => item.id !== id); openChatHistory(); showToast('已刪除這次相談'); }
    function clearChatHistory() { state.chatHistory = []; openChatHistory(); showToast('相談歷史已全部清除'); }

    function sendChat() {
      const input = document.getElementById('chat-input');
      const list = document.getElementById('chat-messages');
      if (!input || !list || !input.value.trim()) return;
      if (state.chatCount >= 30) {
        list.insertAdjacentHTML('beforeend', `<div class="message chef">今天的 AI 相談額度已用完。我仍可以用安全規則幫你切換低體力、查看熟食或安排外食。</div>`);
        input.value = '';
        return;
      }
      const text = input.value.trim();
      list.insertAdjacentHTML('beforeend', `<div class="message user">${escapeHtml(text)}</div><div class="message system" id="thinking">主廚正在整理你的情況…</div>`);
      input.value = '';
      state.chatCount += 1;
      const limitReminder = state.chatCount === 25 ? ' · 剩 5 則，建議完成這次決策' : state.chatCount === 29 ? ' · 剩 1 則，之後切換規則協助' : state.chatCount === 30 ? ' · 已達上限，接下來使用規則協助' : '';
      document.getElementById('chat-limit').textContent = `今天已使用 ${state.chatCount} / 30 則${limitReminder}`;
      list.scrollTop = list.scrollHeight;
      setTimeout(() => {
        document.getElementById('thinking')?.remove();
        const tired = /累|沒力|快速|省力/.test(text);
        const lunch = /明天|便當|下一餐|午餐/.test(text);
        const takeout = /外食|不煮/.test(text);
        const reply = takeout
          ? '可以，今晚外食不會扣除圓夢金。我會保留下一餐時間，等你確認後才取消今晚原本的料理安排。'
          : tired
            ? '我會把低體力放在第一順位。先吃熟食只要加熱 5 分鐘；如果想替明天準備，可以改成 18 分鐘的青蔥蛋香烏龍麵。'
            : '我把你的條件和冰箱重新對過了。最穩的做法是先處理熟食，再把青蔥排進下一餐；不需要為了完成計畫勉強多煮。';
        list.insertAdjacentHTML('beforeend', `<div class="message chef">${reply}</div><div class="chat-action-card"><span class="tag">AI 建議 · 尚未執行</span><strong style="margin-top:6px">${takeout ? '今晚改外食，保留下一餐' : lunch ? '今晚處理熟食，明天午餐另煮' : '切換低體力雙餐方案'}</strong><p>飲食限制與廚具會由後端再次檢核；按下確認才建立任務。</p><button class="btn btn-small btn-jade" onclick="applyChatAction()">預覽並確認</button></div>`);
        list.scrollTop = list.scrollHeight;
      }, 650);
    }

    function applyChatAction() { state.selected = 'prepared'; state.nextStrategy = 'separate'; closeOverlay(); openAllocation(); }
    function escapeHtml(value) { return value.replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch])); }

    function completeRestock() { state.shoppingReady = true; if (state.task) state.task.status = 'ready'; renderSecondaryRoute(); showToast('補買已入庫，任務食材已齊'); }
    function startCooking() { state.cookStep = 0; renderCooking(); }
    function renderCooking() {
      const item = optionData[state.selected];
      const steps = recipeData[state.selected].steps;
      const [label, instruction, ingredients] = steps[state.cookStep];
      document.getElementById('overlay-root').innerHTML = `<section class="flow-screen"><header class="flow-head"><button onclick="closeOverlay()">×</button><div><strong>${item.title}</strong><div style="font-size:8px;color:var(--muted)">預計 ${state.servings} 份 · 離線文字包已備妥</div></div></header><div class="flow-body"><div class="cook-progress">${steps.map((_,i)=>`<i class="${i <= state.cookStep ? 'done' : ''}"></i>`).join('')}</div><article class="card cook-step"><span class="step-no">${label}</span><h2>${instruction}</h2><div class="ingredient-pills">${ingredients.split(' · ').map(x=>`<span>${x}</span>`).join('')}</div></article><div class="card" style="padding:13px"><strong style="font-size:10px">主廚提醒</strong><p class="section-copy">完成後再填實際吃掉與留下份數；現在不先建立熟食。</p></div></div><footer class="sticky-action"><button class="btn btn-primary btn-wide" onclick="nextCookStep()">${state.cookStep === steps.length - 1 ? '完成料理 · 分配餐份' : '下一步'}</button></footer></section>`;
    }
    function nextCookStep() { if (state.cookStep < recipeData[state.selected].steps.length - 1) { state.cookStep += 1; renderCooking(); } else { openCompletion(); } }

    function openCompletion() {
      const item = optionData[state.selected];
      document.getElementById('overlay-root').innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><section class="sheet"><div class="sheet-grab"></div><header class="sheet-head"><div><p class="eyebrow">完成後才分配</p><h2 class="section-title">這次實際煮了多少？</h2></div><button class="icon-close" onclick="closeOverlay()">×</button></header><div class="field-grid"><label class="field">實際完成份數<input id="actual-servings" type="number" min="1" max="12" value="${state.servings}"></label><label class="field">這一餐吃掉<input id="eaten-servings" type="number" min="0" max="12" value="1"></label><label class="field">剩餘保存<select id="storage"><option>冷藏</option><option>冷凍</option></select></label><label class="field">建議食用時間<input type="datetime-local" value="2026-09-11T12:00"></label></div><div class="card" style="padding:12px;margin-top:12px"><strong style="font-size:10px">系統建議 · 請確認</strong><p class="section-copy">剩餘份數會成為「${item.title}」熟食，指定明天午餐。若實際沒有留下，該餐會標為待重選。</p></div><button class="btn btn-jade btn-wide" style="margin-top:13px" onclick="showReward()">確認餐份與保存資訊</button></section></div>`;
    }

    function showReward() {
      const actual = Number(document.getElementById('actual-servings')?.value) || 1;
      const eaten = Math.min(Number(document.getElementById('eaten-servings')?.value) || 0, actual);
      const remaining = Math.max(actual - eaten, 0);
      const rescueExp = state.selected === 'inventory' ? 10 : 0;
      const earnedExp = 30 + rescueExp;
      state.exp += earnedExp;
      state.level = state.exp >= 100 ? 2 : 1;
      if (state.task) state.task.status = 'complete';
      document.getElementById('overlay-root').innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><section class="sheet reward"><div class="trophy">🏆</div><p class="eyebrow">Mission completed</p><h2 class="display" style="font-size:26px">${remaining ? '料理完成，下一餐已接上！' : '料理完成，下一餐待重選！'}</h2><p class="section-copy">成果依這次確認計算；雙餐閉環要等下一餐真的吃掉才成立。</p><div class="reward-grid"><div class="reward-cell"><small>這餐吃掉</small><strong>${eaten} 份</strong></div><div class="reward-cell"><small>留下熟食</small><strong>${remaining} 份</strong></div><div class="reward-cell"><small>圓夢金</small><strong>待你確認</strong></div></div><div class="xp-reveal"><small>完成後揭曉</small><br><strong>＋${earnedExp} EXP</strong><div style="font-size:8px;color:rgba(255,255,255,.67)">料理 +30${rescueExp ? ' · 實際救援即期食材 +10' : ''} · 雙餐閉環待下一餐 +20</div><div class="xp-bar"><span style="width:${Math.min(state.exp, 100)}%"></span></div><div style="font-size:8px;margin-top:6px">Lv.${state.level} ${state.level === 1 ? '開伙見習生' : '一鍋行動派'} · ${state.exp} / 100 EXP</div></div><div class="card" style="padding:10px;margin-top:10px;text-align:left"><b style="font-size:10px">${remaining ? '進行中 · 🍱 雙餐接力' : '需要處理 · 下一餐待重選'}</b><p class="section-copy">${remaining ? '明天吃掉這份熟食後，才會獲得雙餐閉環 EXP 與徽章。' : '保留原本餐期，但不鎖定食材；回 Today 重新選菜。'}</p></div><button class="btn btn-dark btn-wide" style="margin-top:13px" onclick="finishReward()">收下成果，回到 Today</button></section></div>`;
    }
    function finishReward() { closeOverlay(); state.route = 'today'; renderRoute(); showToast('成果已更新；明天午餐已有熟食安排'); }
    function consumePrepared() { state.exp += 10; showToast('已確認吃掉熟食 · ＋10 EXP'); }

    function openProgress() { state.route = 'dream'; renderRoute(); }
    function closeOverlay() { document.getElementById('overlay-root').innerHTML = ''; }
    let toastTimer;
    function showToast(message) { clearTimeout(toastTimer); document.getElementById('toast-root').innerHTML = `<div class="toast" role="status">${message}</div>`; toastTimer = setTimeout(() => document.getElementById('toast-root').innerHTML = '', 2400); }

    function switchVariant(delta) {
      const index = variants.findIndex(v => v.key === state.variant);
      state.variant = variants[(index + delta + variants.length) % variants.length].key;
      const url = new URL(location.href);
      url.searchParams.set('variant', state.variant);
      history.replaceState({}, '', url);
      state.route = 'today';
      closeOverlay();
      renderRoute();
    }
    function updateVariantLabel() {
      const item = variants.find(v => v.key === state.variant) || variants[0];
      document.getElementById('variant-label').innerHTML = `<strong>${item.key}</strong> — ${item.name}`;
    }
    document.getElementById('prev-variant').addEventListener('click', () => switchVariant(-1));
    document.getElementById('next-variant').addEventListener('click', () => switchVariant(1));
    document.addEventListener('keydown', event => {
      const editing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '') || document.activeElement?.isContentEditable;
      if (editing) return;
      if (event.key === 'ArrowLeft') switchVariant(-1);
      if (event.key === 'ArrowRight') switchVariant(1);
      if (event.key === 'Escape') closeOverlay();
    });

    if (!variants.some(v => v.key === state.variant)) state.variant = 'A';
    renderRoute();
  </script>
</body>
</html>
