<html lang="zh-Hant">
<head>

  <title>CooCoo 冰箱沙漏 × 歸位模式 · Throwaway Preview</title>
  <!-- THROWAWAY, MEMORY-ONLY PROTOTYPE. Never promote directly to Production. -->
  <style>
    :root{--paper:#f4f6f1;--white:#fffefa;--ink:#1d3733;--muted:#667873;--line:#cad9d4;--jade:#287d70;--jade2:#dcefe9;--frost:#e7f0f7;--tan:#f1e7d3;--orange:#bd6236;--orange2:#f8e4d6;--red:#91443d;--shadow:0 18px 55px rgba(22,54,49,.18);--sans:ui-rounded,"PingFang TC","Noto Sans TC",system-ui,sans-serif;--serif:"Songti TC","Noto Serif TC",Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
    *{box-sizing:border-box}html{background:#aebfba}body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);background:radial-gradient(circle at 18% 5%,#eff8f5 0,transparent 34rem),linear-gradient(145deg,#d8e4df,#a9bbb6)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(40,125,112,.28);outline-offset:2px}h1,h2,h3,p{margin-top:0}
    .prototype-note{position:fixed;z-index:500;top:9px;left:50%;width:min(92vw,680px);transform:translateX(-50%);padding:8px 12px;border-radius:99px;color:white;background:rgba(23,48,44,.94);font-size:9px;font-weight:900;letter-spacing:.04em;text-align:center}.stage{min-height:100vh;display:grid;place-items:center;padding:52px 12px 24px}.phone{position:relative;width:min(100%,420px);height:min(875px,calc(100vh - 70px));min-height:680px;overflow:hidden;border:8px solid #21302d;border-radius:38px;background:var(--paper);box-shadow:0 30px 90px rgba(21,43,39,.28)}.screen{position:absolute;inset:0;overflow-y:auto;padding-bottom:92px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}
    .top{position:sticky;z-index:30;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid rgba(44,85,78,.1);background:rgba(244,246,241,.91);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:9px}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:8px 15px 15px 8px;color:#fff;background:var(--jade);font-size:17px}.brand strong{display:block;font-family:var(--serif);font-size:15px}.brand small{display:block;color:var(--muted);font-size:7px;font-weight:800}.intake-entry{position:relative;min-height:35px;padding:7px 11px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:var(--white);font-size:8px;font-weight:900}.count{position:absolute;top:-6px;right:-5px;width:17px;height:17px;display:grid;place-items:center;border-radius:50%;color:white;background:var(--orange);font:700 8px var(--mono)}
    .task-strip{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin:11px 12px 0;padding:10px;border-radius:16px;color:white;background:var(--ink);box-shadow:0 10px 26px rgba(29,55,51,.18)}.task-dot{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;color:var(--ink);background:#b9e5dc;font-weight:900}.task-strip strong{display:block;font-size:9px}.task-strip small{display:block;margin-top:2px;color:rgba(255,255,255,.64);font-size:7px}.task-strip button{border-color:rgba(255,255,255,.22);color:white;background:rgba(255,255,255,.08)}
    .body{padding:0 13px 30px}.hero{padding:25px 2px 15px}.eyebrow{margin:0 0 6px;color:var(--jade);font-size:8px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.display{margin:0;font-family:var(--serif);font-size:32px;line-height:1.06;letter-spacing:-.04em}.lede{margin:9px 0 0;color:var(--muted);font-size:9px;line-height:1.6}.filters{display:flex;gap:6px;overflow:auto;padding:1px 1px 12px;scrollbar-width:none}.chip{flex:none;min-height:32px;padding:6px 11px;border:1px solid var(--line);border-radius:99px;color:var(--muted);background:var(--white);font-size:8px;font-weight:900}.chip.on{border-color:var(--jade);color:white;background:var(--jade)}
    .timeline{position:relative;padding-left:19px}.timeline:before{content:"";position:absolute;top:8px;bottom:10px;left:6px;width:1px;background:linear-gradient(var(--orange),var(--jade),#a8bbb6)}.group{position:relative;margin-bottom:16px}.group:before{content:"";position:absolute;top:6px;left:-18px;width:9px;height:9px;border:3px solid var(--paper);border-radius:50%;background:var(--jade);box-shadow:0 0 0 1px var(--jade)}.group.attention:before{background:var(--orange);box-shadow:0 0 0 1px var(--orange)}.group-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:7px}.group-head h2{margin:0;font-family:var(--serif);font-size:17px}.group-head span{color:var(--muted);font-size:7px}.inventory{display:grid;gap:7px}.card{border:1px solid var(--line);border-radius:16px;background:var(--white);box-shadow:0 5px 16px rgba(34,70,64,.05)}.item{padding:11px}.item-main{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:8px}.food-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:12px;background:var(--jade2);font-size:18px}.item h3{margin:0;font-size:10px}.item p{margin:3px 0 0;color:var(--muted);font-size:7px;line-height:1.45}.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.tag{display:inline-flex;width:fit-content;padding:4px 7px;border-radius:99px;color:#315f58;background:var(--jade2);font-size:6px;font-weight:900}.tag.frozen{color:#3e6280;background:var(--frost)}.tag.pantry{color:#70591f;background:var(--tan)}.tag.attn{color:#7d431f;background:var(--orange2)}.actions{display:flex;gap:6px;margin-top:8px}.btn{min-height:38px;padding:7px 11px;border:0;border-radius:11px;font-size:8px;font-weight:900}.btn.small{min-height:30px;padding:5px 8px}.btn.primary{color:white;background:var(--jade)}.btn.dark{color:white;background:var(--ink)}.btn.ghost{border:1px solid var(--line);color:var(--ink);background:var(--white)}.btn.link{min-height:28px;padding:4px;color:var(--jade);background:transparent;text-decoration:underline}.actions .btn{flex:1}.empty{padding:15px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:8px;text-align:center}.capacity{margin-top:20px;padding:12px}.capacity-head{display:flex;justify-content:space-between;align-items:end}.capacity strong{font-size:10px}.capacity b{color:var(--jade);font:700 15px var(--mono)}.bar{height:6px;margin-top:8px;overflow:hidden;border-radius:99px;background:#dde7e3}.bar i{display:block;width:62%;height:100%;background:var(--jade)}.capacity p{margin:7px 0 0;color:var(--muted);font-size:7px;line-height:1.45}.state{margin-top:10px;padding:10px;border-radius:12px;color:#bee6dd;background:#1b302c;font:7px/1.55 var(--mono)}.state strong{color:white}
    .bottom-nav{position:absolute;z-index:80;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));left:10px;height:65px;display:grid;grid-template-columns:repeat(5,1fr);padding:7px;border-radius:21px;background:rgba(27,48,44,.97);box-shadow:0 14px 35px rgba(0,0,0,.24)}.nav-btn{display:flex;align-items:center;flex-direction:column;justify-content:center;gap:3px;border:0;border-radius:14px;color:rgba(255,255,255,.55);background:transparent;font-size:7px;font-weight:800}.nav-btn span{font-size:15px}.nav-btn.active{color:#b9e8dd;background:rgba(255,255,255,.09)}
    .overlay{position:absolute;z-index:160;inset:0;display:flex;align-items:flex-end;background:rgba(12,31,27,.52);backdrop-filter:blur(4px)}.sheet{width:100%;height:94%;display:flex;flex-direction:column;overflow:hidden;border-radius:25px 25px 0 0;background:var(--paper);box-shadow:var(--shadow)}.sheet-head{flex:none;padding:9px 13px 11px;border-bottom:1px solid var(--line);background:rgba(244,246,241,.95)}.grab{width:40px;height:4px;margin:0 auto 10px;border-radius:99px;background:#a7b7b2}.head-row{display:flex;justify-content:space-between;gap:10px}.close{width:33px;height:33px;flex:none;border:1px solid var(--line);border-radius:50%;background:var(--white);font-size:17px}.sheet-scroll{flex:1;overflow-y:auto;padding:12px 13px calc(98px + env(safe-area-inset-bottom));scroll-padding-bottom:180px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}.summary-cell{padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--white)}.summary-cell small{display:block;color:var(--muted);font-size:6px}.summary-cell strong{display:block;margin-top:4px;font-size:9px}.alert{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px;padding:10px;border:1px solid #ebc09f;border-radius:13px;color:#734220;background:#fff0e5;font-size:8px;line-height:1.45}.alert button{margin-left:auto;flex:none}.review{overflow:hidden;margin-bottom:8px}.review summary{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:11px;list-style:none;cursor:pointer}.review summary::-webkit-details-marker{display:none}.review[open] summary{border-bottom:1px solid var(--line);background:#f8fbf9}.status-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:white;background:var(--jade);font-weight:900}.review.risk .status-icon{background:var(--orange)}.review summary strong{display:block;font-size:10px}.review summary small{display:block;margin-top:2px;color:var(--muted);font-size:7px}.chev{color:var(--muted);font-size:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:11px}.fields label{color:var(--muted);font-size:7px;font-weight:900}.field{width:100%;min-height:35px;margin-top:3px;padding:7px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fbfdfa;font-size:9px}.qty{display:grid;grid-template-columns:1fr 60px;gap:5px}.risk-note{grid-column:1/-1;padding:8px;border-radius:9px;color:#75421f;background:var(--orange2);font-size:7px;line-height:1.45}.row-tools{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}.sheet-footer{position:absolute;z-index:2;right:0;bottom:0;left:0;display:grid;grid-template-columns:1fr auto;gap:7px;padding:9px 13px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,254,250,.96);backdrop-filter:blur(16px)}.sheet-footer small{display:block;color:var(--muted);font-size:7px}.sheet-footer strong{font-size:11px}.success{text-align:center;padding-top:30px}.success-icon{width:56px;height:56px;display:grid;place-items:center;margin:0 auto 11px;border-radius:50%;color:white;background:var(--jade);font-size:23px}.success-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:15px}.test-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}.tool{min-height:58px;padding:8px;border:1px solid var(--line);border-radius:13px;color:var(--ink);background:var(--white);font-size:7px;font-weight:900}.toast{position:absolute;z-index:260;right:15px;bottom:88px;left:15px;padding:11px;border-radius:13px;color:white;background:rgba(27,48,44,.96);font-size:8px;font-weight:900;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.22)}
    @media(max-width:360px){.display{font-size:28px}.task-strip{grid-template-columns:auto 1fr}.task-strip button{display:none}.summary{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="prototype-note">THROWAWAY PREVIEW · 僅記憶體互動，不寫入帳號、GitHub 或 Production</div>
  <main class="stage"><div class="phone"><div class="screen" id="screen"></div><nav class="bottom-nav" id="nav"></nav><div id="overlay"></div><div id="toast"></div></div></main>
  <script>
    const baseIntake=()=>[
      {id:'mushroom',name:'金針菇',icon:'🍄',required:180,actual:180,unit:'g',normalized:180,price:35,storage:'cold',expiry:'2026-09-13',risk:null,confirmed:false,selected:true,replacementFor:null,conversion:'直接以公克對帳'},
      {id:'tofu',name:'嫩豆腐',icon:'□',required:300,actual:250,unit:'g',normalized:250,price:32,storage:'cold',expiry:'2026-09-12',risk:'shortage',confirmed:false,selected:true,replacementFor:null,conversion:'實際數量少於任務所需'},
      {id:'rice',name:'白米',icon:'◌',required:0,actual:1,unit:'包',normalized:0,price:119,storage:'pantry',expiry:'',risk:'unit',confirmed:false,selected:true,replacementFor:null,conversion:'尚未確認每包重量'}
    ];
    const state={filter:'all',panel:false,draft:'editing',task:{id:'meal-task-0911',title:'高麗菜豆腐鍋',when:'今天晚餐 → 明天午餐',status:'needs_shopping'},intake:baseIntake(),batches:[],prepared:{id:'prepared-pot-01',name:'高麗菜豆腐鍋',icon:'♨',detail:'指定明天午餐 · 建議明天 12:30 前食用',servings:1,when:'明天午餐',storage:'cold',consumed:false},operationId:'op-intake-7K2',opSeq:7,lastOperation:null,replayed:false,failNext:false,saveError:false,ocrFailed:false,lastAction:'尚未操作'};
    const inventory=[
      {id:'milk',group:'safety',name:'鮮奶',icon:'🥛',detail:'期限尚待確認 · 暫不供任務使用',storage:'cold',category:'常備品'},
      {id:'cabbage',group:'task',name:'高麗菜',icon:'🥬',detail:'任務會使用 · 需要 320g',storage:'cold',category:'蔬菜'},
      {id:'egg',group:'expiring',name:'雞蛋',icon:'🥚',detail:'還有 2 天 · 今天先照顧它',storage:'cold',category:'蛋白質'},
      {id:'pork',group:'safe',name:'豬絞肉',icon:'◒',detail:'冷凍保存 · 還有 18 天',storage:'frozen',category:'蛋白質'},
      {id:'oats',group:'safe',name:'燕麥',icon:'◌',detail:'常溫保存 · 還有 42 天',storage:'pantry',category:'主食'}
    ];
    const storageName={cold:'冷藏',frozen:'冷凍',pantry:'常溫'};
    const pending=()=>state.intake.filter(i=>!i.confirmed).length;
    const current=item=>state.batches.filter(b=>b.shortageId===item.id).reduce((n,b)=>n+b.normalized,0);
    const gap=item=>Math.max(0,item.required-current(item));
    const taskItems=()=>state.intake.filter(i=>i.required>0);
    const taskReady=()=>taskItems().every(i=>gap(i)===0);
    const riskLabel=i=>i.risk==='unit'?'單位無法換算':i.risk==='expiry'?'缺少期限':i.risk==='storage'?'保存方式不安全':i.risk==='replacement'?'替代關係待確認':i.risk==='ocr'?'OCR 信心不足':i.risk==='shortage'?'實際數量少於預計':null;
    const valid=i=>i.selected&&i.actual>0&&i.normalized>0&&i.expiry&&!(i.id!=='rice'&&i.storage==='pantry')&&!['unit','expiry','storage','replacement','ocr'].includes(i.risk);
    function appTop(){return `<header class="top"><div class="brand"><span class="mark">⌛</span><div><strong>CooCoo 冰箱</strong><small>食材守護與任務中繼站</small></div></div><button class="intake-entry" onclick="openIntake()">歸位模式<span class="count">${pending()}</span></button></header>`}
    function taskStrip(){return `<section class="task-strip"><span class="task-dot">${state.task.status==='ready'?'✓':'→'}</span><div><strong>${state.task.when} · ${state.task.title}</strong><small>${state.task.status==='ready'?'食材已齊，可以前往料理':`仍缺嫩豆腐 ${Math.max(0,gap(state.intake[1]))}g`}</small></div><button class="btn small ghost" onclick="returnTask()">返回任務</button></section>`}
    function itemCard(i,prepared=false){const hidden=state.filter!=='all'&&i.storage!==state.filter;if(hidden)return '';const tagClass=i.storage==='frozen'?'frozen':i.storage==='pantry'?'pantry':'';let action='';if(prepared){action=`<div class="actions"><button class="btn primary" ${i.consumed?'disabled':''} onclick="eatPrepared('fridge')">${i.consumed?'已記錄食用':'記錄吃掉 1 份'}</button><button class="btn ghost" onclick="eatPrepared('Today')">${i.consumed?'模擬 Today 重送':'Today 共用操作'}</button></div>`}else if(i.group==='task'){action=`<div class="actions"><button class="btn primary" onclick="returnTask()">前往原任務</button><button class="btn ghost" onclick="showToast('可修改保存位置；不改變任務規則')">查看批次</button></div>`}else if(i.group==='expiring'){action=`<div class="actions"><button class="btn primary" onclick="todayChef()">請主廚提方案</button><button class="btn ghost" onclick="preserve('${i.name}')">先分裝保存</button></div>`}else if(i.group==='safety'){action=`<div class="actions"><button class="btn primary" onclick="showToast('請確認期限；確認前不提供給 MealTask')">確認期限</button></div>`}return `<article class="card item"><div class="item-main"><span class="food-icon">${i.icon}</span><div><h3>${i.name}</h3><p>${i.detail}</p><div class="tags"><span class="tag ${tagClass}">${storageName[i.storage]}</span><span class="tag">${prepared?'熟食':i.category}</span>${i.group==='safety'||i.group==='expiring'?'<span class="tag attn">今天先照顧它</span>':''}</div></div><span class="tag ${tagClass}">${prepared?`${i.servings} 份`:''}</span></div>${action}</article>`}
    function group(key,title,when,items,attention=false){const html=items.map(i=>itemCard(i,i.id===state.prepared.id)).join('');if(!html)return '';return `<section class="group ${attention?'attention':''}"><header class="group-head"><h2>${title}</h2><span>${when}</span></header><div class="inventory">${html}</div></section>`}
    function visibleInventory(groupName){return inventory.filter(i=>i.group===groupName)}
    function statePanel(){return `<div class="state"><strong>VISIBLE PROTOTYPE STATE</strong><br>MealTask.status = ${state.task.status} · filter = ${state.filter}<br>draft = ${state.draft} · pending = ${pending()} · batches = ${state.batches.length}<br>prepared.servings = ${state.prepared.servings} · consumed = ${state.prepared.consumed}<br>operation = ${state.operationId} · last = ${state.lastOperation||'none'} · replayed = ${state.replayed}<br>lastAction = ${state.lastAction}</div>`}
    function render(){document.getElementById('screen').innerHTML=`${appTop()}${taskStrip()}<div class="body"><section class="hero"><p class="eyebrow">冰箱沙漏 · 今日視角</p><h1 class="display">今天先照顧<br>什麼？</h1><p class="lede">讓買回來的每一樣食材，都有清楚的位置、時間與下一步。</p></section><div class="filters">${[['all','全部'],['cold','冷藏'],['frozen','冷凍'],['pantry','常溫']].map(([k,v])=>`<button class="chip ${state.filter===k?'on':''}" onclick="setFilter('${k}')">${v}</button>`).join('')}</div><div class="timeline">${group('safety','先確認安全','期限未明',visibleInventory('safety'),true)}${group('prepared','今天指定的熟食','明天午餐',[state.prepared])}${group('task','這餐會用到','目前 MealTask',visibleInventory('task'))}${group('expiring','今天先照顧它','2 天內',visibleInventory('expiring'),true)}${group('safe','可以安心保存','稍後再用',visibleInventory('safe'))||'<div class="empty">這個保存位置目前沒有其他品項</div>'}</div><section class="card capacity"><div class="capacity-head"><strong>收納空間估計</strong><b>約 62%</b></div><div class="bar"><i></i></div><p>依你填寫的冰箱收納尺寸與品項體積推算，僅供整理參考，不參與 MealTask 判定。</p></section>${statePanel()}</div>`;renderNav();if(state.panel)renderIntake()}
    function renderNav(){document.getElementById('nav').innerHTML=[['today','⌂','今日'],['shopping','▤','採買'],['fridge','⌛','冰箱'],['kitchen','♨','廚房'],['dream','○','圓夢']].map(([id,icon,label])=>`<button class="nav-btn ${id==='fridge'?'active':''}" onclick="showToast('${label}導覽僅示意')"><span>${icon}</span>${label}</button>`).join('')}
    function intakeRow(i){const risk=riskLabel(i);return `<details class="card review ${risk?'risk':''}" ${risk?'open':''}><summary><span class="status-icon">${risk?'!':'✓'}</span><div><strong>${i.icon} ${i.name}${i.replacementFor?`（替代 ${i.replacementFor}）`:''}</strong><small>${i.actual}${i.unit} · $${i.price} · ${storageName[i.storage]}${risk?` · ${risk}`:' · 資料完整'}</small></div><span class="chev">⌄</span></summary><div class="fields"><label>購買日<input class="field" type="date" value="2026-09-11" /></label><label>實付價格<input class="field" type="number" min="0" value="${i.price}" onchange="setPrice('${i.id}',this.value)" /></label><label>實際數量<div class="qty"><input class="field" type="number" min="0" value="${i.actual}" onchange="setActual('${i.id}',this.value)" /><select class="field" onchange="setUnit('${i.id}',this.value)"><option value="g" ${i.unit==='g'?'selected':''}>g</option><option value="盒" ${i.unit==='盒'?'selected':''}>盒</option><option value="包" ${i.unit==='包'?'selected':''}>包</option></select></div></label><label>保存位置<select class="field" onchange="setStorage('${i.id}',this.value)"><option value="cold" ${i.storage==='cold'?'selected':''}>冷藏</option><option value="frozen" ${i.storage==='frozen'?'selected':''}>冷凍</option><option value="pantry" ${i.storage==='pantry'?'selected':''}>常溫</option></select></label><label style="grid-column:1/-1">建議期限<input class="field" type="date" value="${i.expiry}" onchange="setExpiry('${i.id}',this.value)" /></label>${risk?`<div class="risk-note"><strong>${risk}</strong><br>${i.conversion}。可保留草稿，但未完成確認前不覆蓋 MealTask 缺口。</div>`:''}<div class="row-tools">${i.id==='tofu'?'<button class="btn small ghost" onclick="addMissingTofu()">改為足量 300g</button><button class="btn small ghost" onclick="packageTofu()">確認 1 盒＝300g</button>':''}${i.id==='mushroom'?'<button class="btn small ghost" onclick="replacement()">改買杏鮑菇</button>':''}${i.id==='rice'?'<button class="btn small ghost" onclick="confirmRiceUnit()">確認 1 包＝1kg</button>':''}</div></div></details>`}
    function renderIntake(){const validCount=state.intake.filter(i=>!i.confirmed&&valid(i)).length;document.getElementById('overlay').innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="歸位模式"><section class="sheet"><header class="sheet-head"><div class="grab"></div><div class="head-row"><div><p class="eyebrow">A · 入庫驗收台</p><h2 style="margin:0;font-family:var(--serif);font-size:21px">把買到的，安心歸位</h2><p class="lede">完整品項先收合；只展開需要你判斷的風險。</p></div><button class="close" onclick="closeIntake()" aria-label="關閉">×</button></div></header><div class="sheet-scroll">${state.ocrFailed?'<div class="alert"><span><strong>發票辨識失敗</strong><br>原圖已保留，尚未建立庫存。</span><button class="btn small ghost" onclick="ocrFallback()">手動確認</button></div>':''}${state.saveError?'<div class="alert"><span><strong>入庫失敗</strong><br>草稿與 operation ID 已保留。</span><button class="btn small ghost" onclick="commit()">同 ID 重試</button></div>':''}<div class="summary"><div class="summary-cell"><small>來源</small><strong>MealTask 採買</strong></div><div class="summary-cell"><small>待確認</small><strong>${pending()} 項</strong></div><div class="summary-cell"><small>操作編號</small><strong>${state.operationId}</strong></div></div>${state.intake.filter(i=>!i.confirmed).map(intakeRow).join('')||'<div class="empty">這批品項已處理完成</div>'}<div class="test-tools"><button class="tool" onclick="simulateOcr()">測試 OCR 失敗</button><button class="tool" onclick="armFailure()">測試安全重試</button><button class="tool" onclick="resetAll()">重設預覽</button></div>${statePanel()}</div><footer class="sheet-footer"><div><small>可安全建立 ${validCount} 筆新批次</small><strong>${taskReady()?'任務已 ready':'完成後重新讀取庫存判定'}</strong></div><button class="btn primary" ${validCount===0?'disabled':''} onclick="commit()">確認入庫</button></footer></section></div>`}
    function setFilter(v){state.filter=v;state.lastAction=`切換篩選：${v}`;render()}
    function openIntake(){state.panel=true;state.lastAction='開啟歸位模式';render()}
    function closeIntake(){state.panel=false;state.draft='saved_in_memory';state.lastAction='關閉面板：只保留草稿，未建立批次';document.getElementById('overlay').innerHTML='';render();showToast('草稿已保留；沒有建立庫存批次')}
    function recalc(i){if(i.unit==='g'){i.normalized=i.actual;i.risk=i.actual<i.required&&i.required>0?'shortage':(!i.expiry?'expiry':null);i.conversion='直接以公克對帳'}else if(i.id==='tofu'&&i.unit==='盒'){i.normalized=i.actual*300;i.risk=i.expiry?null:'expiry';i.conversion=`${i.actual} 盒＝${i.normalized}g，換算快照已確認`}else{i.normalized=0;i.risk='unit';i.conversion='這個包裝單位還沒有可追溯的換算快照'}}
    function setActual(id,v){const i=state.intake.find(x=>x.id===id);i.actual=Math.max(0,Number(v)||0);recalc(i);render()}
    function setPrice(id,v){state.intake.find(x=>x.id===id).price=Math.max(0,Number(v)||0);render()}
    function setUnit(id,v){const i=state.intake.find(x=>x.id===id);i.unit=v;recalc(i);render()}
    function setStorage(id,v){const i=state.intake.find(x=>x.id===id);i.storage=v;if(i.id!=='rice'&&v==='pantry'){i.risk='storage';i.normalized=0;i.conversion='此品項不可安全常溫保存'}else recalc(i);render()}
    function setExpiry(id,v){const i=state.intake.find(x=>x.id===id);i.expiry=v;recalc(i);render()}
    function addMissingTofu(){const i=state.intake.find(x=>x.id==='tofu');i.actual=300;i.unit='g';i.expiry='2026-09-12';recalc(i);render();showToast('已依實際數量改為 300g')}
    function packageTofu(){const i=state.intake.find(x=>x.id==='tofu');i.actual=1;i.unit='盒';i.expiry='2026-09-12';recalc(i);render();showToast('已保存 1 盒＝300g 的換算快照')}
    function confirmRiceUnit(){const i=state.intake.find(x=>x.id==='rice');i.normalized=1000;i.expiry='2027-03-11';i.risk=null;i.conversion='1 包＝1000g，換算快照已確認';render();showToast('白米的單位與期限已確認')}
    function replacement(){const i=state.intake.find(x=>x.id==='mushroom');i.replacementFor='金針菇';i.name='杏鮑菇';i.risk='replacement';i.normalized=0;i.conversion='已通過飲食限制與食譜初檢，仍需使用者確認對應';render();setTimeout(()=>{i.risk=null;i.normalized=180;i.conversion='使用者已確認替代對應';render();showToast('替代品已由使用者確認，可參與任務判定')},650)}
    function simulateOcr(){state.ocrFailed=true;state.intake[0].risk='ocr';state.intake[0].normalized=0;render()}
    function ocrFallback(){state.ocrFailed=false;const i=state.intake[0];i.risk=null;i.normalized=i.actual;render();showToast('原圖保留；已切換手動欄位確認')}
    function armFailure(){state.failNext=true;state.lastAction='下一次入庫將模擬失敗';render();showToast('已設定下一次入庫失敗情境')}
    function commit(){if(state.lastOperation===state.operationId){state.replayed=true;state.lastAction='相同 operation ID 重送：回傳既有結果';render();showToast('相同 operation ID：沒有重複建立批次');return}if(state.failNext){state.failNext=false;state.saveError=true;state.draft='retryable';state.lastAction='入庫失敗：草稿與 operation ID 保留';render();return}const rows=state.intake.filter(i=>!i.confirmed&&valid(i));if(!rows.length)return;const used=state.operationId;rows.forEach(i=>state.batches.push({id:`batch-${state.batches.length+1}`,mealTaskId:state.task.id,shortageId:i.id,operationId:used,raw:`${i.actual}${i.unit}`,normalized:i.normalized,cost:i.price,storage:i.storage,expiry:i.expiry,source:'shopping'}));rows.forEach(i=>{const remains=gap(i);if(i.required>0&&remains>0){i.confirmed=false;i.actual=remains;i.unit='g';i.normalized=remains;i.risk='shortage';i.conversion=`上一批已入庫，任務仍缺 ${remains}g`}else{i.confirmed=true}});state.lastOperation=used;state.saveError=false;state.draft='committed';state.task.status=taskReady()?'ready':'needs_shopping';state.lastAction=`建立 ${rows.length} 批次；重新讀取後 ${state.task.status}`;if(state.task.status==='ready'){renderResult(true)}else{state.opSeq+=1;state.operationId=`op-intake-${state.opSeq}K2`;renderResult(false)}}
    function renderResult(ready){document.getElementById('overlay').innerHTML=`<div class="overlay" role="dialog" aria-modal="true"><section class="sheet"><div class="sheet-scroll success"><div class="success-icon">${ready?'✓':'→'}</div><p class="eyebrow">MealTask · ${ready?'ready':'needs_shopping'}</p><h2 style="font-family:var(--serif);font-size:23px">${ready?'食材已真實入庫':'先收好買到的部分'}</h2><p class="lede">${ready?'最新有效庫存已覆蓋任務需求。入庫不發 EXP，也不代表料理完成。':`嫩豆腐仍缺 ${gap(state.intake[1])}g；任務保留原時間並回到採買補足。`}</p><div class="success-actions"><button class="btn ghost" onclick="returnTask()">返回任務</button>${ready?'<button class="btn primary" onclick="startKitchen()">直接開始料理</button>':'<button class="btn primary" onclick="openRemaining()">查看剩餘缺口</button>'}</div><button class="btn link" style="margin-top:9px" onclick="replay()">測試相同 operation ID 重送</button>${statePanel()}</div></section></div>`}
    function replay(){state.replayed=true;state.lastAction=`重送 ${state.lastOperation}：回傳既有結果，批次仍為 ${state.batches.length}`;renderResult(state.task.status==='ready');showToast('相同 operation ID：沒有重複建立批次')}
    function openRemaining(){state.panel=true;render()}
    function returnTask(){state.lastAction=`返回 Today MealTask（${state.task.status}）`;showToast(`返回 Today 任務 · ${state.task.status}`)}
    function startKitchen(){state.lastAction='料理文字包已存入裝置 → 前往廚房';document.getElementById('overlay').innerHTML=`<div class="overlay"><section class="sheet"><div class="sheet-scroll success"><div class="success-icon">♨</div><p class="eyebrow">料理包已存入裝置</p><h2 style="font-family:var(--serif);font-size:23px">可以開始料理</h2><p class="lede">正式版必須先確認文字料理包寫入成功，才會導向廚房並宣稱可離線使用。</p><button class="btn dark" style="margin-top:14px" onclick="closeKitchen()">回冰箱預覽</button></div></section></div>`}
    function closeKitchen(){state.panel=false;document.getElementById('overlay').innerHTML='';render()}
    function eatPrepared(source){const op='op-eat-prepared-01';if(state.prepared.consumed){state.lastAction=`${source} 重送 ${op}：不重複扣份數`;showToast('同一食用操作已完成，不重複扣除或計分');return}state.prepared.consumed=true;state.prepared.servings=0;state.lastAction=`${source} 執行共用 ${op}：熟食剩 0 份`;render();showToast('已共用同一操作記錄吃掉；只會計入一次')}
    function todayChef(){state.lastAction='沒有任務的即期食材 → Today 主廚提方案';render();showToast('交給 Today 主廚，冰箱不自行建立菜單')}
    function preserve(name){state.lastAction=`${name} → 分裝保存`;render();showToast(`${name} 已進入分裝保存流程（示意）`)}
    function resetAll(){state.filter='all';state.panel=true;state.draft='editing';state.task.status='needs_shopping';state.intake=baseIntake();state.batches=[];state.prepared.servings=1;state.prepared.consumed=false;state.operationId='op-intake-7K2';state.opSeq=7;state.lastOperation=null;state.replayed=false;state.failNext=false;state.saveError=false;state.ocrFailed=false;state.lastAction='預覽已重設';render();showToast('預覽狀態已重設')}
    let toastTimer;function showToast(msg){clearTimeout(toastTimer);document.getElementById('toast').innerHTML=`<div class="toast" role="status">${msg}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',2500)}
    render();
  </script>
</body>
</html>
