<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CooCoo 冰箱／入庫 × MealTask · Throwaway Preview</title>
  <!--
    THROWAWAY UI PROTOTYPE — do not promote directly to production.
    Question: How should confirmed shopping become trustworthy inventory batches
    before a MealTask may move from needs_shopping to ready?
    Variants: ?variant=A|B|C
    Run: python3 -m http.server 4178 --directory docs/prototypes
  -->
  <style>
    :root {
      --porcelain:#f5f6f1; --ice:#e8f4f2; --frost:#e8eef8; --pantry:#f6ecd6;
      --ink:#203635; --muted:#687572; --line:#cad8d5; --jade:#287f73;
      --jade-dark:#1c5c55; --orange:#c45a2d; --red:#9a3d35; --blue:#3d668f;
      --white:#fffefa; --shadow:0 18px 50px rgba(28,55,52,.16);
      --sans:ui-rounded,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
      --serif:"Songti TC","Noto Serif TC",Georgia,serif;
      --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    *{box-sizing:border-box} html{background:#b9c9c5} body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);background:radial-gradient(circle at 16% 8%,#eef7f4 0,transparent 30rem),linear-gradient(145deg,#d5e2de,#aabdb8)}
    button,input,select{font:inherit} button{cursor:pointer} button:disabled{cursor:not-allowed;opacity:.42}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(40,127,115,.25);outline-offset:2px}
    h1,h2,h3,p{margin-top:0}.notice{position:fixed;z-index:500;top:10px;left:50%;width:min(92vw,700px);transform:translateX(-50%);padding:8px 14px;border-radius:99px;color:#fff;background:rgba(24,49,47,.93);font-size:9px;font-weight:900;letter-spacing:.05em;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.16)}
    .stage{min-height:100vh;display:grid;place-items:center;padding:54px 14px 92px}.phone{position:relative;width:min(100%,420px);height:min(860px,calc(100vh - 84px));min-height:680px;overflow:hidden;border:8px solid #24302e;border-radius:38px;background:var(--porcelain);box-shadow:0 30px 90px rgba(26,43,40,.26)}
    .screen{position:absolute;inset:0;overflow-y:auto;padding-bottom:100px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}
    .top{position:sticky;z-index:40;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 15px 10px;border-bottom:1px solid rgba(40,78,73,.1);background:rgba(245,246,241,.9);backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:9px}.brand-mark{width:35px;height:35px;display:grid;place-items:center;border-radius:7px 14px 14px;color:#fff;background:var(--jade);font-size:18px}.brand strong{display:block;font-family:var(--serif);font-size:15px}.brand small{display:block;color:var(--muted);font-size:7px;font-weight:800}.op-chip{padding:7px 9px;border:1px solid var(--line);border-radius:11px;background:var(--white);font-family:var(--mono);font-size:7px;font-weight:900}
    .task-strip{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;margin:12px 13px 0;padding:10px;border-radius:17px;color:#fff;background:var(--ink);box-shadow:0 12px 28px rgba(32,54,53,.2)}.task-node{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--ink);background:#aee1d7;font-weight:900}.task-strip strong{display:block;font-size:9px}.task-strip small{display:block;margin-top:2px;color:rgba(255,255,255,.65);font-size:7px}.task-strip button{border-color:rgba(255,255,255,.2);color:#fff;background:rgba(255,255,255,.08)}
    .eyebrow{margin:0 0 6px;color:var(--jade);font-size:8px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.display{margin:0;font-family:var(--serif);font-size:31px;line-height:1.06;letter-spacing:-.04em}.lede{margin:9px 0 0;color:var(--muted);font-size:10px;line-height:1.6}.section-title{margin:0;font-family:var(--serif);font-size:19px}.section-copy{margin:4px 0 0;color:var(--muted);font-size:8px;line-height:1.5}
    .card{border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:0 5px 16px rgba(39,67,63,.05)}.btn{min-height:40px;padding:8px 12px;border:0;border-radius:12px;font-size:9px;font-weight:900}.btn-small{min-height:31px;padding:5px 8px;font-size:8px}.btn-primary{color:#fff;background:var(--jade)}.btn-dark{color:#fff;background:var(--ink)}.btn-ghost{border:1px solid var(--line);color:var(--ink);background:var(--white)}.btn-danger{color:#fff;background:var(--red)}.btn-link{min-height:28px;padding:3px;color:var(--jade);background:transparent;text-decoration:underline}.btn-wide{width:100%}
    .tag{display:inline-flex;width:fit-content;padding:4px 7px;border-radius:99px;color:var(--jade-dark);background:var(--ice);font-size:7px;font-weight:900}.tag-warn{color:#804319;background:#f8dfc7}.tag-frozen{color:var(--blue);background:var(--frost)}.tag-pantry{color:#765716;background:var(--pantry)}.tag-ready{color:#fff;background:var(--jade)}
    .hero{padding:22px 2px 14px}.body{padding:0 13px 28px}.alert{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;padding:10px 11px;border:1px solid #efc3a6;border-radius:14px;color:#784122;background:#fff1e7;font-size:8px;line-height:1.45}.alert strong{display:block;font-size:9px}.alert button{margin-left:auto;flex:none}
    .review-card{overflow:hidden}.review-head{display:flex;justify-content:space-between;gap:10px;padding:13px 13px 10px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#edf8f5,#fffefa)}.review-head b{font-family:var(--mono);font-size:15px;color:var(--jade)}
    .intake-row{padding:12px;border-bottom:1px solid #e7eeeb}.intake-row:last-child{border-bottom:0}.intake-top{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:8px}.check{width:31px;height:31px;display:grid;place-items:center;border:2px solid #a8bbb7;border-radius:50%;color:#fff;background:#fff;font-weight:900}.check.on{border-color:var(--jade);background:var(--jade)}.food strong{display:block;font-size:11px}.food small{display:block;margin-top:3px;color:var(--muted);font-size:7px}.gap{color:var(--orange)!important;font-weight:900}.row-actions{display:flex;gap:5px;margin-top:8px;padding-left:39px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px;padding-left:39px}.field-grid label{color:var(--muted);font-size:7px;font-weight:800}.field{width:100%;min-height:34px;margin-top:3px;padding:6px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fbfdfb;font-size:9px}.quantity-box{display:grid;grid-template-columns:1fr 62px;gap:6px}
    .readiness{margin-top:11px;padding:12px}.meter-head{display:flex;justify-content:space-between;gap:9px;align-items:end}.meter-head strong{font-size:11px}.meter-head b{font-family:var(--mono);font-size:15px;color:var(--jade)}.meter{height:6px;margin-top:8px;overflow:hidden;border-radius:99px;background:#dce8e5}.meter i{display:block;width:var(--coverage);height:100%;background:linear-gradient(90deg,var(--orange),var(--jade));transition:width .25s}.ledger{margin-top:8px}.ledger-row{display:grid;grid-template-columns:1fr auto;gap:7px;padding:7px 0;border-top:1px dashed #d8e3df;font-size:8px}.ledger-row b{color:var(--orange)}.ledger-row.ok b{color:var(--jade)}
    .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.tool{min-height:64px;padding:9px;border:1px solid var(--line);border-radius:14px;color:var(--ink);background:var(--white);text-align:left}.tool span{display:block;font-size:16px}.tool strong{display:block;margin-top:4px;font-size:8px}.tool small{color:var(--muted);font-size:7px}
    .run-footer{position:sticky;z-index:30;bottom:76px;display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:13px;padding:8px;border:1px solid var(--line);border-radius:17px;background:rgba(255,254,250,.94);box-shadow:0 12px 32px rgba(32,54,53,.16);backdrop-filter:blur(14px)}.run-total{padding:4px 7px}.run-total small{display:block;color:var(--muted);font-size:7px}.run-total strong{display:block;font-size:13px}
    .state{margin-top:12px;padding:10px;border-radius:12px;color:#b9e5dc;background:#1d302e;font-family:var(--mono);font-size:7px;line-height:1.55}.state strong{color:#fff}
    .bottom-nav{position:absolute;z-index:80;right:11px;bottom:calc(9px + env(safe-area-inset-bottom));left:11px;height:65px;display:grid;grid-template-columns:repeat(5,1fr);padding:7px;border-radius:21px;background:rgba(29,48,46,.97);box-shadow:0 14px 34px rgba(0,0,0,.24)}.nav-btn{display:flex;align-items:center;flex-direction:column;justify-content:center;gap:3px;border:0;border-radius:14px;color:rgba(255,255,255,.55);background:transparent;font-size:7px;font-weight:800}.nav-btn span{font-size:15px}.nav-btn.active{color:#b7eadf;background:rgba(255,255,255,.09)}
    .switcher{position:fixed;z-index:550;bottom:7px;left:50%;display:grid;grid-template-columns:42px minmax(200px,270px) 42px;align-items:center;transform:translateX(-50%);overflow:hidden;border-radius:99px;color:#fff;background:rgba(25,45,43,.97);box-shadow:0 12px 30px rgba(0,0,0,.25)}.switcher button{height:42px;border:0;color:#fff;background:rgba(255,255,255,.05);font-size:18px}.switch-label{text-align:center;font-size:8px;font-weight:900}
    .overlay{position:absolute;z-index:180;inset:0;display:flex;align-items:flex-end;padding:13px;background:rgba(15,31,29,.5);backdrop-filter:blur(5px)}.sheet{width:100%;max-height:90%;overflow-y:auto;padding:13px;border-radius:24px 24px 17px 17px;background:var(--porcelain);box-shadow:var(--shadow)}.grab{width:40px;height:4px;margin:0 auto 12px;border-radius:99px;background:#a8b6b3}.sheet-head{display:flex;justify-content:space-between;gap:10px}.close{width:33px;height:33px;border:1px solid var(--line);border-radius:50%;background:var(--white);font-size:17px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.summary-cell{padding:10px;border:1px solid var(--line);border-radius:13px;background:var(--white)}.summary-cell small{display:block;color:var(--muted);font-size:7px}.summary-cell strong{display:block;margin-top:4px;font-size:10px}.success{width:54px;height:54px;display:grid;place-items:center;margin:2px auto 10px;border-radius:50%;color:#fff;background:var(--jade);font-size:24px}.toast{position:absolute;z-index:260;right:16px;bottom:90px;left:16px;padding:11px;border-radius:13px;color:#fff;background:rgba(29,48,46,.95);font-size:9px;font-weight:800;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.2)}
    .zone-stack{display:grid;gap:9px}.zone{padding:12px}.zone-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.zone-head strong{font-family:var(--serif);font-size:15px}.zone.cold{background:var(--ice)}.zone.frozen{background:var(--frost)}.zone.pantry{background:var(--pantry)}.zone-item{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:8px;border-radius:11px;background:rgba(255,255,255,.74);font-size:9px}.zone-item+ .zone-item{margin-top:6px}.zone-empty{padding:9px;border:1px dashed rgba(70,100,95,.25);border-radius:11px;color:var(--muted);font-size:8px;text-align:center}
    .requirement{padding:12px;margin-bottom:8px}.req-head{display:flex;justify-content:space-between;gap:8px}.req-head strong{font-size:12px}.req-head b{color:var(--orange);font-family:var(--mono);font-size:10px}.req-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.req-cell{padding:8px;border-radius:10px;background:#f0f5f3}.req-cell small{display:block;color:var(--muted);font-size:6px}.req-cell strong{display:block;margin-top:3px;font-size:9px}.req-actions{display:flex;gap:6px;margin-top:8px}.req-actions button{flex:1}
    @media (max-width:360px){.display{font-size:27px}.task-strip{grid-template-columns:auto 1fr}.task-strip button{display:none}}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div class="notice">THROWAWAY PREVIEW · 記憶體狀態，不會寫入帳號、GitHub 或 Production</div>
  <main class="stage"><div class="phone"><div class="screen" id="screen"></div><nav class="bottom-nav" id="nav"></nav><div id="overlay"></div><div id="toast"></div></div></main>
  <div class="switcher"><button id="prev" aria-label="上一個方案">←</button><div class="switch-label" id="variant-label"></div><button id="next" aria-label="下一個方案">→</button></div>
  <script>
    const variants=[{key:'A',name:'入庫驗收台 · 推薦'},{key:'B',name:'溫層歸位'},{key:'C',name:'任務缺口對帳'}];
    const freshItems=()=>[
      {id:'mushroom',name:'金針菇',icon:'🍄',expected:180,actual:180,unit:'g',normalized:180,storage:'cold',expiry:'2026-09-13',price:35,selected:true,confirmed:false,replacementFor:null,conversion:null},
      {id:'tofu',name:'嫩豆腐',icon:'□',expected:300,actual:250,unit:'g',normalized:250,storage:'cold',expiry:'2026-09-12',price:32,selected:true,confirmed:false,replacementFor:null,conversion:null},
    ];
    const state={variant:new URLSearchParams(location.search).get('variant')||'A',task:{id:'meal-task-preview',title:'高麗菜豆腐鍋',status:'needs_shopping',servings:2,when:'今天晚餐 → 明天午餐'},purchaseDate:'2026-09-10',items:freshItems(),batches:[],operationId:'op-restock-7K2',operationSequence:7,lastOperation:null,replayed:false,ocrFailed:false,saveError:false,failNext:false,cancelled:false};
    const labels={cold:'冷藏',frozen:'冷凍',pantry:'常溫'};
    const currentCoverage=item=>state.batches.filter(b=>b.requirementId===item.id).reduce((sum,b)=>sum+b.normalized,0);
    const projectedCoverage=item=>currentCoverage(item)+(item.selected&&!item.confirmed?item.normalized:0);
    const remaining=(item,projected=false)=>Math.max(0,item.expected-(projected?projectedCoverage(item):currentCoverage(item)));
    const taskReady=()=>state.items.every(item=>remaining(item)===0);
    const projectedReady=()=>state.items.every(item=>remaining(item,true)===0);
    const storageSafe=item=>item.storage!=='pantry';
    const draftValid=()=>state.items.filter(i=>i.selected&&!i.confirmed).every(i=>i.normalized>0&&i.expiry&&storageSafe(i));
    const coveragePercent=(projected=false)=>Math.round(state.items.reduce((sum,item)=>sum+Math.min(item.expected,projected?projectedCoverage(item):currentCoverage(item)),0)/state.items.reduce((sum,item)=>sum+item.expected,0)*100);
    function appTop(){return `<header class="top"><div class="brand"><span class="brand-mark">▦</span><div><strong>CooCoo 冰箱</strong><small>買到多少，就如實收多少</small></div></div><span class="op-chip">${state.operationId}</span></header>`}
    function taskStrip(){const text=state.task.status==='ready'?'食材已齊 · 可直接料理':`入庫後仍缺 ${state.items.reduce((s,i)=>s+remaining(i),0)}g`;return `<section class="task-strip"><span class="task-node">${state.task.status==='ready'?'✓':'→'}</span><div><strong>${state.task.when} · ${state.task.title}</strong><small>${text}</small></div><button class="btn btn-small btn-ghost" onclick="returnToday()">回 Today</button></section>`}
    function alerts(){return `${state.ocrFailed?`<div class="alert"><div><strong>發票辨識失敗</strong>原圖保留；沒有建立庫存。可改用手動確認目前品項。</div><button class="btn btn-small btn-ghost" onclick="manualFallback()">手動確認</button></div>`:''}${state.saveError?`<div class="alert"><div><strong>入庫尚未完成</strong>操作編號與確認內容已保留，可安全重試。</div><button class="btn btn-small btn-danger" onclick="commitRestock()">使用同一 ID 重試</button></div>`:''}`}
    function locationSelect(item){return `<select class="field" onchange="setStorage('${item.id}',this.value)"><option value="cold" ${item.storage==='cold'?'selected':''}>冷藏</option><option value="frozen" ${item.storage==='frozen'?'selected':''}>冷凍</option><option value="pantry" ${item.storage==='pantry'?'selected':''}>常溫</option></select>`}
    function itemRow(item){const gap=remaining(item,true);return `<div class="intake-row"><div class="intake-top"><button class="check ${item.selected?'on':''}" ${item.confirmed?'disabled':''} onclick="toggleItem('${item.id}')">${item.selected?'✓':''}</button><div class="food"><strong>${item.icon} ${item.name}${item.replacementFor?` <span class="tag tag-warn">替代 ${item.replacementFor}</span>`:''}</strong><small>任務需要 ${item.expected}g · ${item.conversion||'直接以公克對帳'}</small><small class="${gap||!storageSafe(item)?'gap':''}">${!storageSafe(item)?'此食材不可常溫保存，請改選冷藏或冷凍':gap?`預計入庫後仍缺 ${gap}g`:'預計可完整覆蓋任務'}</small></div><span class="tag ${item.storage==='frozen'?'tag-frozen':item.storage==='pantry'?'tag-pantry':''}">${labels[item.storage]}</span></div><div class="field-grid"><label>實際數量<div class="quantity-box"><input class="field" type="number" min="0" value="${item.actual}" onchange="setActual('${item.id}',this.value)"/><select class="field" onchange="setUnit('${item.id}',this.value)"><option value="g" ${item.unit==='g'?'selected':''}>g</option><option value="盒" ${item.unit==='盒'?'selected':''}>盒</option><option value="包" ${item.unit==='包'?'selected':''}>包</option></select></div></label><label>實付價格<input class="field" type="number" min="0" value="${item.price}" onchange="setPrice('${item.id}',this.value)"/></label><label>保存位置${locationSelect(item)}</label><label>建議期限<input class="field" type="date" value="${item.expiry}" onchange="setExpiry('${item.id}',this.value)"/></label></div><div class="row-actions"><button class="btn btn-small btn-link" onclick="fillExact('${item.id}')">補足示範</button>${item.id==='tofu'?`<button class="btn btn-small btn-link" onclick="usePackageUnit('${item.id}')">改成 1 盒</button>`:''}${item.id==='mushroom'&&!item.confirmed?`<button class="btn btn-small btn-link" onclick="useReplacement()">改用杏鮑菇</button>`:''}</div></div>`}
    function readiness(projected=true){const pct=coveragePercent(projected);return `<section class="card readiness" style="--coverage:${pct}%"><div class="meter-head"><div><p class="eyebrow">${projected?'確認後預估':'已入庫結果'}</p><strong>${projected?(projectedReady()?'任務可轉為 ready':'任務仍需採買'):(taskReady()?'任務已 ready':'任務仍是 needs_shopping')}</strong></div><b>${pct}%</b></div><div class="meter"><i></i></div><div class="ledger">${state.items.map(i=>`<div class="ledger-row ${remaining(i,projected)===0?'ok':''}"><span>${i.name} · 需要 ${i.expected}g</span><b>${remaining(i,projected)===0?'已覆蓋':`缺 ${remaining(i,projected)}g`}</b></div>`).join('')}</div></section>`}
    function tools(){return `<div class="tools"><button class="tool" onclick="simulateOcrFail()"><span>▣</span><strong>測試 OCR 失敗</strong><small>原圖保留</small></button><button class="tool" onclick="armFailure()"><span>↻</span><strong>測試入庫失敗</strong><small>同 ID 重試</small></button><button class="tool" onclick="resetState()"><span>↺</span><strong>重設情境</strong><small>清空預覽狀態</small></button></div>`}
    function statePanel(){return `<div class="state"><strong>PROTOTYPE STATE</strong><br>MealTask.status = ${state.task.status}<br>batches = ${state.batches.length} · operation = ${state.lastOperation||'none'} · replayed = ${state.replayed}<br>confirmed coverage = ${coveragePercent(false)}% · draft coverage = ${coveragePercent(true)}%</div>`}
    function footer(){const count=state.items.filter(i=>i.selected&&!i.confirmed).length;return `<div class="run-footer"><div class="run-total"><small>準備確認 ${count} 項 · ${projectedReady()?'入庫後可料理':'入庫後仍有缺口'}</small><strong>${state.items.filter(i=>i.selected&&!i.confirmed).reduce((s,i)=>s+i.price,0)} 元</strong></div><button class="btn btn-primary" ${!count||!draftValid()?'disabled':''} onclick="openConfirm()">確認並入庫</button></div>`}
    function renderA(){return `${appTop()}${taskStrip()}<div class="body"><section class="hero"><p class="eyebrow">A · 入庫驗收台</p><h1 class="display">先把買到的，<br>驗清楚再收好。</h1><p class="lede">數量、單位、保存位置與期限都由你確認；只有真實入庫後才重新判斷任務。</p></section>${alerts()}<section class="card review-card"><header class="review-head"><div><p class="eyebrow">待入庫 · 來自任務採買</p><h2 class="section-title">逐項確認</h2><p class="section-copy">購買日 ${state.purchaseDate} · 系統提供保存建議，但不替你猜測。</p></div><b>${state.items.filter(i=>!i.confirmed).length} ITEMS</b></header>${state.items.filter(i=>!i.confirmed).map(itemRow).join('')||`<div style="padding:18px;text-align:center;font-size:9px">本次品項已處理</div>`}</section>${readiness(true)}${tools()}${statePanel()}${footer()}</div>`}
    function zone(name,key,klass){const items=state.items.filter(i=>!i.confirmed&&i.storage===key);return `<section class="card zone ${klass}"><header class="zone-head"><strong>${name}</strong><span class="tag">${items.length} 項</span></header>${items.length?items.map(i=>`<div class="zone-item"><span>${i.icon} <strong>${i.name}</strong> · ${i.actual}${i.unit}</span><button class="btn btn-small btn-ghost" onclick="cycleStorage('${i.id}')">換位置</button></div>`).join(''):`<div class="zone-empty">目前沒有放在這一區的品項</div>`}</section>`}
    function renderB(){return `${appTop()}${taskStrip()}<div class="body"><section class="hero"><p class="eyebrow">B · 溫層歸位</p><h1 class="display">一袋一袋，<br>放回正確的位置。</h1><p class="lede">先依實際保存方式歸位，再確認期限與任務覆蓋；適合回家後邊收邊操作。</p></section>${alerts()}<div class="zone-stack">${zone('冷藏室 · 4°C','cold','cold')}${zone('冷凍庫 · -18°C','frozen','frozen')}${zone('常溫櫃','pantry','pantry')}</div><section class="card" style="padding:12px;margin-top:10px"><p class="eyebrow">數量與期限</p>${state.items.filter(i=>!i.confirmed).map(itemRow).join('')}</section>${readiness(true)}${tools()}${statePanel()}${footer()}</div>`}
    function requirementCard(item){const got=projectedCoverage(item),gap=remaining(item,true);return `<section class="card requirement"><div class="req-head"><strong>${item.icon} ${item.replacementFor?`${item.name}（替代 ${item.replacementFor}）`:item.name}</strong><b>${gap?`缺 ${gap}g`:'足夠'}</b></div><div class="req-bar"><div class="req-cell"><small>料理需要</small><strong>${item.expected}g</strong></div><div class="req-cell"><small>預計可用</small><strong>${got}g</strong></div><div class="req-cell"><small>保存</small><strong>${labels[item.storage]}</strong></div></div><div class="req-actions"><button class="btn btn-small btn-ghost" onclick="fillExact('${item.id}')">調整為足量</button>${item.id==='mushroom'&&!item.confirmed?`<button class="btn btn-small btn-ghost" onclick="useReplacement()">測試替代品</button>`:`<button class="btn btn-small btn-ghost" onclick="cycleStorage('${item.id}')">修改保存</button>`}</div></section>`}
    function renderC(){return `${appTop()}${taskStrip()}<div class="body"><section class="hero"><p class="eyebrow">C · 任務缺口對帳</p><h1 class="display">這鍋還差多少，<br>逐項對清楚。</h1><p class="lede">從料理需求出發，比對已入庫與這次買到的份量；最直接解釋為何任務尚未 ready。</p></section>${alerts()}${state.items.map(requirementCard).join('')}${readiness(true)}<details class="card" style="margin-top:10px;padding:12px"><summary style="font-size:9px;font-weight:900">展開完整入庫欄位</summary>${state.items.filter(i=>!i.confirmed).map(itemRow).join('')}</details>${tools()}${statePanel()}${footer()}</div>`}
    function render(){document.getElementById('screen').innerHTML=state.variant==='B'?renderB():state.variant==='C'?renderC():renderA();document.getElementById('variant-label').textContent=`${state.variant} · ${variants.find(v=>v.key===state.variant).name}`;document.getElementById('nav').innerHTML=[['today','⌂','今日'],['shopping','▤','採買'],['fridge','▦','冰箱'],['kitchen','♨','廚房'],['dream','○','圓夢']].map(([id,icon,label])=>`<button class="nav-btn ${id==='fridge'?'active':''}" onclick="showToast('${label}導覽僅示意')"><span>${icon}</span>${label}</button>`).join('')}
    function toggleItem(id){const i=state.items.find(x=>x.id===id);if(i&&!i.confirmed)i.selected=!i.selected;render()}
    function recalc(i){if(i.unit==='g')i.normalized=i.actual;else if(i.unit==='盒'&&i.id==='tofu'){i.normalized=i.actual*300;i.conversion=`${i.actual}盒 = ${i.normalized}g（包裝換算已確認）`}else if(i.unit==='包'){i.normalized=i.actual*180;i.conversion=`${i.actual}包 = ${i.normalized}g（包裝換算已確認）`}else{i.normalized=0;i.conversion='單位尚未建立換算，不能覆蓋任務'}}
    function setActual(id,v){const i=state.items.find(x=>x.id===id);i.actual=Math.max(0,Number(v)||0);recalc(i);render()}
    function setPrice(id,v){const i=state.items.find(x=>x.id===id);i.price=Math.max(0,Number(v)||0);render()}
    function setUnit(id,v){const i=state.items.find(x=>x.id===id);i.unit=v;recalc(i);render()}
    function setStorage(id,v){const i=state.items.find(x=>x.id===id);i.storage=v;render();if(!storageSafe(i))showToast('這項食材不可常溫保存，確認入庫已暫停')}
    function setExpiry(id,v){state.items.find(x=>x.id===id).expiry=v;render()}
    function fillExact(id){const i=state.items.find(x=>x.id===id);i.actual=i.expected;i.unit='g';i.normalized=i.expected;i.conversion=null;i.selected=true;render();showToast(`${i.name} 已調整為任務所需 ${i.expected}g`)}
    function usePackageUnit(id){const i=state.items.find(x=>x.id===id);i.actual=1;i.unit='盒';recalc(i);i.selected=true;render();showToast('已確認這盒嫩豆腐淨重 300g')}
    function useReplacement(){const i=state.items.find(x=>x.id==='mushroom');i.replacementFor='金針菇';i.name='杏鮑菇';i.icon='🍄';i.actual=180;i.unit='g';i.normalized=180;i.conversion='後端已檢核食譜相容與飲食限制';i.selected=true;render();showToast('替代已通過安全檢核；仍需實際入庫')}
    function cycleStorage(id){const i=state.items.find(x=>x.id===id),keys=['cold','frozen'];i.storage=keys[(keys.indexOf(i.storage)+1)%keys.length];render();showToast(`${i.name} 改為${labels[i.storage]}`)}
    function simulateOcrFail(){state.ocrFailed=true;render()}
    function manualFallback(){state.ocrFailed=false;render();showToast('已切換逐項手動確認；尚未入庫')}
    function armFailure(){state.failNext=true;showToast('下一次入庫將模擬網路失敗')}
    function openConfirm(){const selected=state.items.filter(i=>i.selected&&!i.confirmed);document.getElementById('overlay').innerHTML=`<div class="overlay" role="dialog" aria-modal="true"><section class="sheet"><div class="grab"></div><header class="sheet-head"><div><p class="eyebrow">最後確認</p><h2 class="section-title">建立 ${selected.length} 筆庫存批次</h2><p class="section-copy">確認後才寫入；任務會依最新批次重新計算。</p></div><button class="close" onclick="closeOverlay()">×</button></header><div class="summary-grid"><div class="summary-cell"><small>操作編號</small><strong>${state.operationId}</strong></div><div class="summary-cell"><small>預估任務結果</small><strong>${projectedReady()?'ready':'needs_shopping'}</strong></div>${selected.map(i=>`<div class="summary-cell"><small>${i.name}</small><strong>${i.actual}${i.unit} · ${labels[i.storage]}</strong></div>`).join('')}</div><button class="btn btn-primary btn-wide" style="margin-top:12px" onclick="commitRestock()">確認寫入庫存</button><button class="btn btn-link btn-wide" onclick="cancelDraft()">取消，保留待確認內容</button></section></div>`}
    function nextOperationId(){state.operationSequence+=1;state.operationId=`op-restock-${state.operationSequence}K2`}
    function commitRestock(){if(state.lastOperation===state.operationId){state.replayed=true;closeOverlay();render();showToast('相同 operation ID 已執行；沒有重複建立批次');return}if(state.failNext){state.failNext=false;state.saveError=true;closeOverlay();render();return}const selected=state.items.filter(i=>i.selected&&!i.confirmed);const usedOperation=state.operationId;selected.forEach(i=>state.batches.push({id:`batch-${i.id}-${state.batches.length+1}`,requirementId:i.id,name:i.name,normalized:i.normalized,unit:i.unit,actual:i.actual,storage:i.storage,expiry:i.expiry,price:i.price,operationId:usedOperation}));selected.forEach(i=>{const gap=remaining(i);if(gap>0){i.confirmed=false;i.selected=false;i.actual=gap;i.unit='g';i.normalized=gap;i.conversion=`上一批已入庫，仍缺 ${gap}g`}else{i.confirmed=true}});state.lastOperation=usedOperation;state.saveError=false;state.task.status=taskReady()?'ready':'needs_shopping';if(state.task.status!=='ready')nextOperationId();closeOverlay();render();state.task.status==='ready'?openReady():showToast(`已入庫 ${selected.length} 項；任務仍有缺口`)}
    function cancelDraft(){state.cancelled=true;closeOverlay();render();showToast('已取消本次寫入；確認內容仍保留')}
    function openReady(){document.getElementById('overlay').innerHTML=`<div class="overlay" role="dialog" aria-modal="true"><section class="sheet" style="text-align:center"><div class="grab"></div><div class="success">✓</div><p class="eyebrow">MealTask · ready</p><h2 class="section-title">食材已真實入庫</h2><p class="section-copy">高麗菜豆腐鍋所需份量已由最新庫存覆蓋。入庫沒有發 EXP，也不代表料理完成。</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px"><button class="btn btn-ghost" onclick="returnToday()">返回任務</button><button class="btn btn-primary" onclick="startCooking()">直接開始料理</button></div><button class="btn btn-link btn-wide" onclick="replayOperation()">測試重送同一操作</button></section></div>`}
    function replayOperation(){closeOverlay();commitRestock()}
    function returnToday(){closeOverlay();showToast(`返回 Today：${state.task.status}`)}
    function startCooking(){document.getElementById('overlay').innerHTML=`<div class="overlay" role="dialog" aria-modal="true"><section class="sheet" style="text-align:center"><div class="grab"></div><div class="success">♨</div><p class="eyebrow">交接到廚房</p><h2 class="section-title">準備「${state.task.title}」料理包</h2><p class="section-copy">正式版只有在料理文字包成功存入裝置後，才能宣稱可離線開始。</p><button class="btn btn-dark btn-wide" style="margin-top:12px" onclick="closeOverlay()">回冰箱預覽</button></section></div>`}
    function closeOverlay(){document.getElementById('overlay').innerHTML=''}
    function resetState(){state.task.status='needs_shopping';state.items=freshItems();state.batches=[];state.operationSequence=7;state.lastOperation=null;state.replayed=false;state.ocrFailed=false;state.saveError=false;state.failNext=false;state.cancelled=false;state.operationId='op-restock-7K2';closeOverlay();render();showToast('預覽已重設')}
    let toastTimer;function showToast(msg){clearTimeout(toastTimer);document.getElementById('toast').innerHTML=`<div class="toast" role="status">${msg}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',2400)}
    function switchVariant(delta){const n=variants.findIndex(v=>v.key===state.variant);state.variant=variants[(n+delta+variants.length)%variants.length].key;const url=new URL(location.href);url.searchParams.set('variant',state.variant);history.replaceState(null,'',url);closeOverlay();render()}
    document.getElementById('prev').onclick=()=>switchVariant(-1);document.getElementById('next').onclick=()=>switchVariant(1);document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowLeft')switchVariant(-1);if(e.key==='ArrowRight')switchVariant(1)});if(!variants.some(v=>v.key===state.variant))state.variant='A';render();
  </script>
</body>
</html>
